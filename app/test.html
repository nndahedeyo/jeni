<title>jeni テスト版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark light">
<style>
/* jeni テスト版（つながない）。出来事はこの端末の中だけで計算し、どこにも送らない。何人かを切り替えて、きまりどおりに動くかを確かめる */
:root{
  --bg:#0f1411; --card:#171e19; --sunk:#1f2822; --ink:#e7ede8; --mute:#8fa094; --line:#2b372f;
  --gold:#e2c06b; --gold-ink:#1a1608; --leaf:#7fbf8a; --leaf-soft:#1f3326; --warn:#e8a07a;
  --t-rwa:#1d2a1f; --t-media:#1b1f2e; --t-text:#2a2219;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#efe9dc; --card:#f8f4ea; --sunk:#e6dfcf; --ink:#2b261c; --mute:#7a705d; --line:#d8cfbb;
  --gold:#a87a1e; --gold-ink:#fffaf0; --leaf:#3f7a4c; --leaf-soft:#dde9da; --warn:#b4552a;
  --t-rwa:#e9ecdc; --t-media:#e3e4ea; --t-text:#efe3d1; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#efe9dc; --card:#f8f4ea; --sunk:#e6dfcf; --ink:#2b261c; --mute:#7a705d; --line:#d8cfbb;
  --gold:#a87a1e; --gold-ink:#fffaf0; --leaf:#3f7a4c; --leaf-soft:#dde9da; --warn:#b4552a;
  --t-rwa:#e9ecdc; --t-media:#e3e4ea; --t-text:#efe3d1; color-scheme:light;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,.line:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.coin{display:inline-block;width:1.2em;height:1.15em;vertical-align:-.22em;flex:none;color:var(--ink);filter:drop-shadow(0 0 3px rgba(226,182,78,.55))}
.lp.go .coin,.pill.go .coin,.big .coin{color:currentColor;filter:none}

/* テスト版の帯：だれとして見ているか */
.tbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.tbar .tag{border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
.tbar label{display:flex;align-items:center;gap:6px;margin-left:auto}
.tbar select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;min-height:32px}
.tbar .reset{border:0;background:none;color:var(--mute);text-decoration:underline;padding:4px}

/* プロフィールカード（メニューを兼ねる） */
.me{aspect-ratio:1.586;max-width:100%;border-radius:18px;background:var(--card);border:1px solid var(--line);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;overflow:hidden}
.me-l{display:grid;grid-template-rows:auto 1fr auto auto;gap:6px;min-width:0;min-height:0}
.me-top{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;min-width:0}
.me-top>div:nth-child(2){min-width:0}
.av{width:42px;height:42px;border-radius:28%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.14);background-size:cover;background-position:center;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-weight:700;flex:none}
.me-name{font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-line{font-size:12px;color:var(--mute)}
.bal{display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap}
.bal small{font-size:12px;color:var(--mute);font-weight:600}
.me-mid{display:flex;justify-content:flex-start;align-items:center;gap:8px;min-height:0;min-width:0}
.pmark{position:relative;border:0;background:none;padding:0;color:var(--gold);border-radius:10px;animation:glow2 3.6s ease-in-out infinite;width:42px;height:42px;display:grid;place-items:center}
.pmark svg{display:block;overflow:visible;width:100%;height:auto}
.pmark .halo{stroke:transparent}
@keyframes glow2{0%,100%{filter:drop-shadow(0 0 1px rgba(226,182,78,.3))}50%{filter:drop-shadow(0 0 6px rgba(226,182,78,.9))}}
.menu-w{display:flex;align-items:end;min-width:0}
.menu{position:relative;flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:18px}
.menu::-webkit-scrollbar{display:none}
.menu button{flex:0 0 max(34px, calc((100% - 24px) / 5.5))}
.me-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;min-height:0}
.me-r .make{flex:none;width:44px;height:44px;border:0;border-radius:14px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(150,110,30,.25)}.me-r .make svg.i{width:24px;height:24px;stroke-width:2.2}
.me-line{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:360px){.me-line{-webkit-line-clamp:1}.mods span{display:none}.mods button{padding:0 7px}.me{padding:12px;gap:8px}.me-l{gap:4px}.cb{width:26px;height:26px}.cb svg.i{width:15px;height:15px}.comm{gap:2px}.me-top .av{width:34px;height:34px}.me-name{font-size:15px}.bal{font-size:15px;padding:2px 0}.me-r .make{width:36px;height:36px;border-radius:11px}.me-r .make svg.i{width:20px;height:20px}.pmark{width:36px;height:36px}}
.comm{display:flex;gap:4px}
.cb{position:relative;width:32px;height:32px;border:0;border-radius:999px;background:transparent;color:var(--ink);display:grid;place-items:center;padding:0}.cb svg.i{width:21px;height:21px}
.pmark .kdot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#e0604f;animation:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}.seg button[aria-pressed="true"]{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf);font-weight:700}
.ess{margin:0;padding:12px 14px 12px 32px;border-radius:14px;background:var(--sunk);font-size:15px;font-weight:600;line-height:1.9;text-align:left}
.keyv{font:600 13px/1.6 ui-monospace,monospace;word-break:break-all;user-select:all;background:var(--sunk);padding:10px;border-radius:10px;margin:0}
.cb b{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:#e0604f}
.menu button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--mute);display:grid;place-items:center;padding:0}
.menu button[aria-pressed="true"]{background:var(--leaf);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.mcap{font-size:10px;line-height:1.2;color:var(--mute);opacity:.85;padding:0 2px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mods{display:flex;gap:4px;align-self:end;margin-right:auto;min-width:0;flex-wrap:nowrap}.mods button{display:inline-flex;align-items:center;gap:3px;height:24px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mute);padding:0 8px 0 6px;font:inherit;font-size:11px;white-space:nowrap}.mods svg.i{width:13px;height:13px}
/* 比べるための見せ方（テスト版）：はじめは「見る・持つ・作る・話す」だけ。しぼり・並び・お知らせは隠す */
body.lite .mods,body.lite .menu [data-f]:not([data-f="all"]):not([data-f="people"]),body.lite [data-fx="gifts"],body.lite [data-fx="news"],body.lite .pcomm [data-giftp]{display:none!important}
.mods button[aria-pressed="true"]{background:var(--leaf);border-color:transparent;color:#fff}.mods button[data-mod="fav"][aria-pressed="true"] svg.i{fill:currentColor}
.dist{flex:none;font-weight:700;color:var(--leaf);font-size:11px;margin-right:2px;white-space:nowrap}
.fv svg.i{fill:#e0a92e;stroke:#e0a92e}
.cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);padding:0 4px}
.notice{background:var(--leaf-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.notice b{color:var(--leaf)}

/* 一覧：小さな行 */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{position:relative;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.line{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.avs.lg{width:52px;height:52px;border-radius:12px;font-size:20px}
.psearch{display:block;padding:8px 12px 4px}.psearch input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px}
.th{width:52px;height:52px;border-radius:12px;border:0;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;background:var(--sunk);color:var(--mute)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th[data-k="music"],.th[data-k="video"]{background:var(--t-media);color:var(--ink)}
.th[data-k="text"]{background:var(--t-text)} .th[data-k="rwa"]{background:var(--t-rwa)}
.th .pl{position:absolute;inset:auto 4px 4px auto;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.th .pl svg.i{width:12px;height:12px;fill:currentColor;stroke:none}
.mid{min-width:0}
.t{font-weight:700;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);min-width:0;margin-top:2px}
.s svg.i{width:14px;height:14px}
.s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .left{color:var(--leaf);font-weight:700;flex:none}
.s .lk{color:var(--gold);flex:none}
.hold{display:flex;align-items:center;gap:4px;border:0;border-radius:999px;min-height:36px;padding:0 12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--leaf);color:var(--bg);white-space:nowrap}
.hold .lb{font-size:11px;font-weight:600;opacity:.85;margin-right:2px}
.hold.free{background:transparent;border:1px solid var(--leaf);color:var(--leaf)}
.bar{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.empty{color:var(--mute);text-align:center;padding:28px 12px;margin:0;font-size:13px}
@media (max-width:360px){.line{gap:10px;padding:10px}.line .hold{padding:0 10px}}

/* 詳細・作る画面（シート） */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--leaf);font-weight:700;padding:6px 0;min-height:40px}
.rh{font-size:20px;margin:6px 2px 2px}
.sub{margin:0 2px;font-size:13px;color:var(--mute)}
.acts2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acts2 .mine{margin-right:auto;font-size:12px;color:var(--mute)}
.pill{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.go{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.pill.warn{color:var(--warn)}
.flow{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:8px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:13px;line-height:1.6}
.flow dt{color:var(--mute)} .flow dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.flow small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.box h3{font-size:13px;color:var(--mute);margin:0 0 6px;font-weight:600}
.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px}
.kv dt,.kv dd{padding:8px 0;border-top:1px solid var(--line);margin:0;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv>:nth-child(-n+2){border-top:0}
.who-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.who-row:first-of-type{border-top:0}
.who-row span{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-row .pill{min-height:34px;font-size:13px;padding:0 12px}
.preview{border-radius:14px;overflow:hidden;background:var(--sunk)}
.preview img,.preview video{width:100%;display:block}
.preview.small img{filter:blur(6px) saturate(.9);transform:scale(1.05)}
.preview p{margin:0;padding:12px 14px;font-size:14px;line-height:1.8;background:var(--t-text)}
.preview audio{width:100%;display:block}
.lockmsg{font-size:12px;color:var(--mute);padding:8px 14px;display:flex;gap:6px;align-items:center}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);cursor:pointer}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--leaf)}
.opt b{font-size:14px} .opt small{grid-column:2;font-size:12px;color:var(--mute);line-height:1.5}
.opt.off{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;min-height:36px;font-size:14px;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.fl{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.fl input,.fl textarea,.fl select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.fl textarea{min-height:80px;resize:vertical}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:999px;padding:4px}
.tabs button{border:0;border-radius:999px;background:none;min-height:36px;font-weight:700;font-size:14px;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.ph-pick{position:relative;display:grid;place-items:center;aspect-ratio:1.586;border-radius:18px;border:2px dashed var(--line);background:var(--sunk) var(--img,none) center/cover;color:var(--mute);font-weight:700;cursor:pointer;overflow:hidden}
.ph-pick.has{border-style:solid}
.ph-pick:not(.has){aspect-ratio:3}
.ph-pick.mp{aspect-ratio:auto;min-height:64px}
.ph-pick.mp.has span{background:none;color:var(--leaf);align-self:center;margin:0}
.ph-pick.has span{background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;align-self:end;margin-bottom:12px}
.ph-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph-pick:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.big{border:0;border-radius:999px;min-height:48px;font-weight:700;background:var(--leaf);color:var(--bg);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.big.ghost{background:transparent;border:1px solid var(--leaf);color:var(--leaf)}
.qrbox{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;justify-items:center}
.qrwrap{position:relative;width:min(100%,260px)}
.qrwrap svg.q{width:100%;display:block;border-radius:8px;transition:opacity .4s}
.ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none}
.ring rect{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.who-sees{margin:4px 0 0;padding:8px 12px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:13px}
.done{display:grid;justify-items:center;gap:6px;text-align:center;padding-top:16px}
.done .coin{width:84px;height:80px;transform-origin:50% 90%;animation:nup 1.1s cubic-bezier(.34,1.3,.5,1) both, shine 3.6s ease-in-out 1.2s infinite}
/* ぬっぽり：下からふくらみ、少しつぶれて、ゆっくり落ち着く */
.coin.idle{opacity:.38;filter:none;animation:breathe 4.8s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1)}}
.story{display:grid;justify-items:center;gap:10px;text-align:center;padding-top:12px}.story .coin{width:96px;height:92px}.story .sl{font-size:20px;font-weight:700;margin:6px 0 0;min-height:2.6em;display:grid;align-content:center;text-wrap:balance}.story .ss{font-size:14px;color:var(--mute);margin:0;min-height:1.6em}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
@keyframes nup{0%{transform:translateY(14px) scale(.2,.15);opacity:0}45%{transform:translateY(-4px) scale(1.12,.9);opacity:1}70%{transform:translateY(0) scale(.95,1.06)}100%{transform:none}}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 2px rgba(226,182,78,.35))}50%{filter:drop-shadow(0 0 10px rgba(226,182,78,.9))}}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:grid;gap:8px}
.rules li{counter-increment:r;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 44px;position:relative;font-size:14px;line-height:1.7}
.rules li::before{content:counter(r);position:absolute;left:14px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-size:12px;font-weight:700;display:grid;place-items:center}
.rules b{display:block}
.rnote{margin:0;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:13px;line-height:1.8;color:var(--mute)}
.rnote b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
/* 1枚ずつ上下にめくる */
.sheet.feed{scroll-snap-type:y proximity;padding-top:0;padding-bottom:0}
.sheet.feed>.wrap{gap:0}
.ftop{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) 0 6px;background:linear-gradient(var(--bg) 70%,transparent)}
.ftop .imm-b{border:0;background:none;color:var(--mute);font-size:12px;text-decoration:underline;text-underline-offset:3px;min-height:36px}
/* 全画面：カードだけ。押すものは隠す（もどすで戻る） */
.sheet.imm{background:#000;scroll-snap-type:y mandatory;padding:0}
.sheet.imm>*{max-width:none!important;padding:0!important;margin:0!important}
.sheet.imm .pg{height:100dvh;min-height:100dvh;padding:0;scroll-margin-top:0;scroll-snap-stop:always}
.sheet.imm .jc2{height:100dvh;width:100%;aspect-ratio:auto;perspective:none}
.sheet.imm .jc2 .face{border-radius:0;box-shadow:none;background:#000}
.sheet.imm .jc2 .bgimg,.sheet.imm .jc2 video.inplay{object-fit:contain}
.sheet.imm .jc2 .gfield,.sheet.imm .jc2 .mark{display:none}

<script>// jeni の決まり（試験版）。署名つきの出来事（イベント）の並びから、だれが計算しても同じ状態になる。
// 運営もサーバーもいない。決まりに合わない出来事は、どの画面でも同じように無視される。
//
// jeni の5つのきまり
//  1 はじまり：認められて参加すると、決まった量の jeni が届く（jeni が新しく生まれるのはここだけ）
//  2 持つ　　：持つと、カードに書かれたものを受け取れる。作った人から持つと、値段の分の jeni が作った人へ。値段はずっと変わらない
//             （デジタルは元のデータを何度でも。現物はそのものを1回。受け取るとなくなるものは「使った」になる）
//  3 譲る　　：数に限りのあるカードは、持っている人から同じ値段で譲り受ける。jeni は手放した人へ
//  4 投げ銭　：半分は作った人へ、半分は持っている人へ（枚数に応じて）。受け取るとなくなるもの（数に限りのあるカード）と、お店・会社や団体は全額が作った人へ。
//             プロジェクトは、半分を自分のカードをつないで育てた人で等しく分ける（版2から）
//  5 上限　　：同じカードは3枚まで（無料のカードは1枚まで）。使うか贈ると、また持てる
"use strict";
(function (root) {
  const R = {
    version: 4,         // きまりの版（2：プロジェクトへの投げ銭の半分は、自分のカードをつないだ人へ。3：1人が認められるのは10人まで）。出来事には {v: 版} を付ける。版のない出来事は 1 とみなす。知らない（新しすぎる）版は読まない
    start: 1000,        // 参加したときに届く jeni（配る量は使われ方を見て変わることがある。変わるときも全員に同じきまり）
    vouchMax: 10,       // 1人が認められる人数のいちばん多いとき（はじまりの人と、その人が認めた人）
    vouchBy: [10, 10, 10, 5, 3],   // はじまりの人から何段目か（0＝はじまりの人）で、認められる人数（版4から。近い2段は多く、3次は5人、4次から3人）。版3は全員10人、版2までは3人
    capPaid: 3,         // 同じカードを持てる数
    capFree: 1,         // 無料のカードを持てる数
    priceMax: 1000000,
    tipMax: 1000000,
    sendMax: 1000000,   // jeni を直接贈れる額の上限（1回）
    futureSkew: 600,    // 未来の時刻の出来事は、この秒数より先なら無視する
    saleMax: 600,       // その場で売るカードの QR が使える長さ（秒）の上限
    founders: [],       // 最初の人たち（だれにも認められずに参加できる）。試験のはじめに決める
    flagsToHide: 2,     // 危ないカード・会話を隠すのに要る知らせの数（実績のある別々の人から）
    redeemMax: 600,     // 現物を引き換える QR が使える長さ（秒）の上限
    commentMax: 500,
    inviteMax: 7 * 86400,   // 招待のリンク・QR が使える長さ（秒）の上限
  };
  R.vmax = u => R.vouchBy[Math.min((u && u.depth) || 0, R.vouchBy.length - 1)];   // いまの版で、その人が認められる人数
  const KINDS = ["rwa", "event", "service", "music", "video", "picture", "text", "app", "shop", "org", "project", "other"];
  // つなぐカード：ほかのカードを束ねる。プロジェクトはだれでも自分のカードをつなげる。お店・会社や団体は、作った人だけが自分のカードをつなぐ
  const BUNDLE = ["project", "shop", "org"], OPEN_BUNDLE = ["project"];
  const COUNTED = ["rwa", "event", "service"];   // 数があるもの（持った人に1回）。イベントの定員・サービスの枠もいる
  const AT = ["rwa", "event", "service", "shop"];   // 日時・場所・地図の点（受け取る場所・会場・お店）を持てるもの
  // カードの裏の QR は、いつも「そのカードを開く」だけ（外のリンクや支払いにはしない：にせの画面へ誘う悪用を防ぎ、読んだだけで jeni が動かないように）
  const isHex = (s, n) => typeof s === "string" && new RegExp(`^[0-9a-f]{${n}}$`).test(s);
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";

  // 小さな SHA-256（その場で売るときの「一度きりの番号」を確かめるため。計算は同期で、どの画面でも同じ）
  function sha256hex(text) {
    const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
    const bytes = Array.from(new TextEncoder().encode(text)), len = bytes.length * 8;
    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (len >>> (i * 8)) & 255);
    let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const r = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < bytes.length; o += 64) {
      const w = new Array(64);
      for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
      for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;

      }

      if (c.t === "redeem") {

      if (c.t === "refund") {

      }

      if (c.t === "tip") {

        // 版2から：プロジェクトは、自分のカードをつないで育てた人（作った人のほか）で半分を等しく分ける。仲間になっただけの人には分けない
        if (card.kind === "project" && (c.v || 1) >= 2) for (const it of card.items) if (it.by !== card.by && U(it.by).member) holders[it.by] = 1;
        const n = Object.values(holders).reduce((a, b) => a + b, 0);
        me.bal -= c.amount;
        let toCreator = c.amount;
        if (n) {

  ["{#}枚（{#}枚まで）・{#}枚目がカードの表。{#}枚以上で、自動でめくれるアルバムに。", "$1 ($2 max) · the first is the cover. Two or more make an auto-playing album."], ["{#}枚（{#}枚まで）・{#}枚目がカードの表。カードの上で自動でゆっくりめくれます。", "$1 ($2 max) · the first is the cover. They slowly flip on the card."],

  ["またはリンク（YouTube・動画のファイルの https）", "Or a link (YouTube or an https video file)"], ["またはリンク（YouTube・音のファイルの https）", "Or a link (YouTube or an https audio file)"],
  ["動画はスマホの画面できれいな画質に軽くし、長いものは分けて置きます（長いほど、軽くして送るのに時間がかかります。そのあいだ画面を開いたままに）（無料の置き場・続けて{#}本として流れます）。置いたものはリンクを知っている人ならだれでも見られるので、自分で作ったものか、権利のあるものだけにしてください。", "Videos are compressed to look good on phones and long ones are split (longer videos take longer — keep the screen open). They're stored for free and play as one. Anyone with the link can view them, so only upload your own work or things you have rights to."],
  ["動画はスマホの画面できれいな画質に軽くし、長いものは分けて置きます（長いほど、軽くして送るのに時間がかかります。そのあいだ画面を開いたままに）（無料の置き場・続けて{#}本として流れます）。自分で作ったものか、権利のあるものだけにしてください。", "Videos are compressed to look good on phones and long ones are split (longer videos take longer — keep the screen open). They're stored for free and play as one. Only upload your own work or things you have rights to."],
  ["音は MP{#} の {#}〜{#}kbps と同じくらいの音質（AAC {#}kbps）にそろえ、長いものは分けて置きます（無料の置き場・続けて{#}本として流れます）。置いたものはリンクを知っている人ならだれでも見られるので、自分で作ったものか、権利のあるものだけにしてください。", "Audio is set to quality similar to MP3 at 256–320 kbps (AAC 192 kbps) and long files are split. Stored for free and played as one. Anyone with the link can listen, so only upload your own work or things you have rights to."],
  ["音は MP{#} の {#}〜{#}kbps と同じくらいの音質（AAC {#}kbps）にそろえ、長いものは分けて置きます（無料の置き場・続けて{#}本として流れます）。自分で作ったものか、権利のあるものだけにしてください。", "Audio is set to quality similar to MP3 at 256–320 kbps (AAC 192 kbps) and long files are split. Stored for free and played as one. Only upload your own work or things you have rights to."],
  ["見せる相手", "Who can see"], ["見せる相手（先に決めます）", "Who can see (choose first)"], ["みんな", "Everyone"], ["{*}（輪の人だけ）", "$1 (circle only)"],
  ["輪の人だけが開ける鍵で封をしてから置きます。置き場の人にも中身は見えません（ファイルの大きさと置いた時刻だけは見えます）。輪の人が自分の端末に保存することは防げません。", "Sealed with a key only circle members can open. Storage operators can't see the contents (only file size and upload time). Members can still save copies on their own devices."],
  ["見せる相手を変えたときは、写真を外してから選び直してください", "If you change who can see, remove the photos and choose again"], ["見せる相手を変えたときは、選び直してください", "If you change who can see, choose again"],
  ["仲間の輪をつくる", "Create a circle"], ["輪をつくる", "Create circle"], ["輪の名前", "Circle name"], ["入ってもらう人", "Members"], ["入ってもらう人を選んでください", "Choose members"], ["「{*}」をつくりました", "Created \"$1\""], ["輪のかぎがまだ届いていません", "The circle key hasn't arrived yet"],
  ["カードを出す", "Post card"], ["カードを出しました", "Card posted"], ["出せませんでした", "Couldn't post"], ["参加すると作れます", "Join to make cards"], ["作る画面へ", "To the make screen"],
  ["準備が終わるまで、少し待ってください", "Please wait until it's ready"], ["音を選んでください", "Choose audio"], ["動画を選んでください", "Choose a video"], ["写真を選んでください", "Choose a photo"], ["リンクは https:// から", "Links must start with https://"],
  ["アプリのURLは https:// から", "App URLs must start with https://"], ["アプリのURL（持っている人だけに見える）", "App URL (visible to holders only)"], ["題を入れてください", "Enter a title"],
  ["写真と値段で、一度きりのQR", "Photo and price make a one-time QR"], ["その場のカード", "On-the-spot card"],
  ["2時間までです", "Up to 2 hours"], ["ファイルが大きすぎます", "The file is too large"], ["長さが読めませんでした", "Couldn't read the length"], ["動画が入っていません", "No video in this file"], ["音が入っていません", "No audio in this file"],
  ["この端末では動画を変換できません", "This device can't convert video"], ["この形のファイルは変換できません", "This file type can't be converted"], ["分けても大きすぎました", "Still too large after splitting"],
  ["変換の部品を読み込めませんでした（回線を確かめて、もう一度）", "Couldn't load the converter (check your connection and try again)"], ["写真を読めませんでした", "Couldn't read the photo"], ["写真を置けませんでした", "Couldn't upload the photo"],
  ["置き場につながりませんでした", "Couldn't reach storage"], ["置けませんでした", "Couldn't upload"], ["再生できませんでした", "Couldn't play"], ["再生できませんでした（置き場につながりません）", "Couldn't play (storage unreachable)"],
  ["プロジェクトにつなぐ", "Add to a project"], ["自分のカードをつなぐ", "Add your card"], ["つなぎました", "Added"],
  ["「{*}」に、あなたのカードをつなぎます。つないだカードはそのまま、あなたのものです。つないだ人は、このプロジェクトへの投げ銭の半分を、ほかのつないだ人と等しく分けます。", "Add your card to \"$1\". It stays yours. Everyone who adds a card shares half of this project's tips equally."],
  ["つながったカード {#}", "Linked cards $1"], ["お店の品 {#}", "Shop items $1"], ["この会社・団体のカード {#}", "This organization's cards $1"], ["つながったカードと会話で、少しずつ育てています。", "Growing little by little through linked cards and conversation."],

  // ---- きまり ----
  ["はじまり", "Start"], ["上限", "Limit"], ["持っている人が一度きりのQRを出し、作った人が読むと「使った」に。", "The holder shows a one-time QR; when the maker scans it, it becomes \"used\"."],
  ["持つと、カードに書かれたものを受け取れます。データは元のデータを何度でも、現物はそのものを{#}回、イベントは参加を{#}回、体験・サービスは受けるのを{#}回。お店・会社や団体・プロジェクト（つなぐカード）は無料で、持つと常連・会員・仲間になり、いつでもやめられます。作った人から持つと、値段の分の jeni が作った人へ。値段はずっと変わりません。", "Holding a card gets you what it offers: data as often as you like, goods once, events once, experiences once. Shops, organizations and projects are free to join and you can leave anytime. Getting a card from its maker sends the price in jeni to them. Prices never change."],
  ["数に限りのあるカードは、持っている人から同じ値段で譲り受けます。jeni は手放した人へ戻ります。", "Limited cards can be taken over from a holder at the same price. The jeni goes to whoever gives it up."],
  ["半分は作った人へ、半分は持っている人へ（鍵をかけて持っている人はのぞく：分け前の動きから、どのカードを持っているかが分かってしまうため）。受け取るとなくなるもの（現物など数に限りのあるカード）と、お店・会社や団体は、全額が作った人へ。プロジェクトは、半分を自分のカードをつないで育てた人で等しく分けます（仲間になるのは無料でだれでもなれるので、なっただけの人には分けません）。", "Half goes to the maker, half to holders (except locked holders — shares would reveal what they hold). Limited cards that get used up, shops and organizations send everything to the maker. Projects split half equally among people who added their own cards (joining is free, so joining alone doesn't earn a share)."],
  ["同じカードは{#}枚まで（無料のカードは{#}枚まで）。使うか贈ると、また持てます。", "Up to $1 of the same card ($2 for free cards). Use or give one to get another."],
  ["認められて（招待のリンク・QRからも）参加すると、{#} jeni が届きます。{#}人が認めて・招待してあげられるのは合わせて、はじまりの人と1次・2次の人は{#}人、3次の人は{#}人、4次からは{#}人まで（遠くなるほど慎重に。ひとりで何人ぶんも参加するのを防ぐため）。カードを作れるのは参加している人です。", "When someone vouches for you (or you use an invite link/QR), $1 jeni arrives. Vouches and invites combined: the founder and people 1–2 steps away can do up to $3, 3 steps away up to $4, and 4+ steps away up to $5 (more careful farther out, to stop one person joining many times). Only members can make cards."],
  ["会話・友達・知らせる", "Chat, friends & reports"], ["QRは{#}つ", "Three kinds of QR"], ["直す・取り下げる", "Edit & withdraw"], ["見えるもの・隠れるもの", "What's visible, what's hidden"], ["贈る", "Give"], ["配る量について", "About issuance"], ["運営のサーバーはありません", "There is no central server"],
  ["カードの会話は、参加している人ならだれでも書けます（輪のカードは輪の人だけ）。{#}人だけの会話と通話（ビデオ通話も）は、お互いに友達のときだけ（名前の下の「やりとり」、または相手のカードから）。危ないカードや会話は、実績のある別々の人{#}人の知らせで隠れます。現物・イベント・体験は、持っている人が出す一度きりのQRを作った人が読んで、受け取り・参加・受けたことにします。", "Any member can write in a card's chat (circle cards: members only). Private chat and calls (including video) are only between mutual friends (from the bubbles under your balance, or their card). Unsafe cards or messages are hidden after reports from $2 separate established members. For goods, events and experiences, the maker scans the holder's one-time QR to mark it received, attended or used."],
  ["どのQRも、読んだだけで jeni は動きません（読んだ人が自分の画面で長押ししたときだけ）。", "No QR moves jeni just by being scanned (only when the scanner long-presses on their own screen)."],
  ["・カードの裏・プロフィールのQR：カードや人が開きます（紹介・友達になる・参加を認める）", "· Card back / profile QR: opens a card or person (share, add friend, vouch)"],
  ["・QRで受け取る：作った人・売る人が出すQR。読んだ人の画面に「持つ」と「投げ銭」が出て、長押しすると jeni が出した人に届きます（その場で売るときは{#}分・{#}回だけ）", "· Receive via QR: shown by the maker or seller. The scanner sees \"Get\" and \"Tip\"; a long-press sends jeni to the QR's owner (on-the-spot sales: $1 min, once)"],
  ["・QRで引き換える（入る・受ける）：持っている人が出し、作った人が読むQR。現物の受け取り・入場・体験に", "· Redeem via QR (enter/use): shown by the holder, scanned by the maker. For pickups, entry and experiences"],
  ["決まると、両方の画面の小さなカードが同じように光ります。招待は一度きりのリンクで送ります（QRにもできます）。", "When it goes through, the small card lights up on both screens. Invites are sent as one-time links (or QR)."],
  ["作った人は、題・説明・日時・場所・画像を直せます（値段・数・種類は直せません）。取り下げると、だれも持っていないカードは消え、持っている人がいるカードは受付を終えます（持っている人のものはそのまま）。自分の書いた会話は消せます。直した・消したことは記録に残ります。", "Makers can edit title, description, date, place and image (not price, quantity or type). Withdrawing removes a card no one holds; otherwise it closes (holders keep theirs). You can delete your own messages. Edits and deletions are recorded."],
  ["だれがだれに何 jeni 払ったかは、確かめ合うために記録に残り、だれでも見られます（番号と、その人が決めた名前で）。見せ方は{#}つ：「みんなに見せる」、「かくす（分け前あり）」＝画面に出さないだけで記録を調べれば分かる・投げ銭の分け前を受け取れる、「鍵をかける（分け前なし）」＝どのカードかは本人と作った人にしか分からない（数に限りのないカードだけ・分け前が届くと分かってしまうので受け取らない）。仲間の輪の中身（写真・音・動画も）は、輪の人にしか読めません。ただし、輪の人が自分の端末に保存したり、輪から外れた人がそれまでに見たものを持っていたりすることは防げません。{#}人だけの会話・通話も同じで、相手の手元に残ることは防げません。", "Who paid whom and how much is recorded for everyone to verify (by ID and chosen name). Three visibility options: \"Show to everyone\"; \"Hide (still get tip shares)\" = not on screen but discoverable in records; \"Lock (no tip shares)\" = only you and the maker know which card (unlimited cards only; shares would reveal it). Circle content (including photos, audio, video) is readable only by members — but members can save copies, and people who leave keep what they already saw. Private chats and calls are the same: the other person can keep them."],
  ["jeni や持っているカードを、参加している人に直接届けられます（残高の下の贈り物の印か、相手のプロフィールカードから・長押しで決める）。贈ると取り消せません。だれからだれへ何を贈ったかは記録に残ります。", "You can send jeni or cards you hold directly to any member (gift icon under your balance or their profile card · long-press to confirm). Gifts can't be undone. Who gave what to whom is recorded."],
  ["配る量や配り方は、使われ方を見て変わることがあります。変わるときも全員に同じきまりが同じように当てはまり、前もって知らせます。jeni は円と交換できず、値段は作った人が決めるので、配る量の大きさそのものに意味はありません。", "The amount and method of issuance may change based on use. Any change applies equally to everyone and is announced in advance. jeni can't be exchanged for money and makers set prices, so the issued amount itself has no special meaning."],
  ["記録は、だれでも立てられる複数の中継（リレー）に置き、それぞれの端末にも写しを持ちます。{#}か所が止まっても、ほかに残ります。無料の中継は古い記録を消すことがあるので、記録の書き出しで守ります。また毎日、記録の「指紋」（中身は分からない{#}文字）をビットコインに刻み、日付をさかのぼった書き換えができないようにしています。", "Records live on several relays anyone can run, with a copy on each device. If one stops, the others remain. Free relays may delete old records, so export protects you. Every day a record \"fingerprint\" (64 characters that reveal nothing) is stamped on Bitcoin, so no one can rewrite the past."],

  ["しぼり：持っている・お気に入り・近く", "Filters: mine · favorites · nearby"], ["アイコンの上の{#}つ。いくつでも重ねられ、どの項目にもかかります（例：持っている×音楽、お気に入り×近く×現物）。", "The 3 above the icons. Combine freely across any type (e.g. mine × music, favorites × nearby × goods)."],
  ["よく見るものを手前に", "Most-used first"], ["並びは すべて・音楽・動画・写真・文章 → 現物・イベント・体験 → アプリ・お店・会社や団体・プロジェクト → 仲間の輪。", "Order: all · music · video · photo · writing → goods · events · experiences → apps · shops · organizations · projects → circles."],
  ["カードのページ", "Card page"], ["どのカードも同じ並び：カード → 作った人・投げ銭・持つ → 値段・残り・持っている人・jeni の行き先 → 受け取る →「くわしく・記録」（そのカードだけの話と、持っている人・譲る・贈る・記録）。", "Every card has the same layout: card → maker · tip · get → price · left · holders · where jeni goes → receive → \"Details & record\"."],
  ["投げ銭は{#}か所で", "Tipping in one place"], ["額を押すと {#}→{#}→{#}→{#} と変わり（最初に届く {#} jeni に合わせた段）、となりを長押しで贈ります。", "Tap the amount to cycle $1→$2→$3→$4 (steps scaled to the first $5 jeni); long-press next to it to send."],
  ["カードのページの右上「全画面」。写真・動画は画面いっぱいに、{#}枚ずつめくれます。", "\"Full screen\" at the top right of a card page. Photos and videos fill the screen, one at a time."],
  ["カードの裏・プロフィールのQR＝開く。作った人のカードの「QRで受け取る」＝読んだ人の画面に 持つ と 投げ銭 が{#}つに出る（その場で売るQRも同じ）。持っている人の「QRで引き換える」＝作った人が読む。決まると両方の小さなカードが光ります。", "Card back / profile QR = open. \"Receive via QR\" on a maker's card = the scanner sees get and tip together (same for on-the-spot sales). \"Redeem via QR\" = the maker scans the holder's QR. Both small cards light up when done."],
  ["アルバム", "Album"], ["写真のカードに{#}枚まで。カードの表でゆっくり自動でめくれ、押すと大きく{#}枚ずつ。", "Up to $1 photos per card. They flip slowly on the card; tap to view large, one at a time."],
  ["残高の下の贈り物の印、または相手のプロフィールカードから。jeni や持っているカードを、相手に直接届けます（長押しで決める・取り消せない）。届いた贈り物はお知らせに。", "Gift icon under your balance, or from their profile card. Send jeni or cards directly (long-press · can't be undone). Received gifts appear in Notices."],
  ["お互いに友達の人と。相手のプロフィールカードか電話の一覧のカメラの印から。受ける人は「ビデオで出る」か「声だけで出る」を選べます。", "With mutual friends. Use the camera icon on their profile card or the call list. The receiver chooses video or voice only."],
  ["何を持っているかに鍵", "Lock what you hold"], ["プロフィールの「編集する」→ カードを持ったときの見せ方。鍵をかけると、どのカードかは本人と作った人だけ（だれに何 jeni 払ったかは記録に出ます）。数に限りのないカードだけ。", "Profile \"Edit\" → when you hold a card. Locked: only you and the maker know which card (payments are still recorded). Unlimited cards only."],
  ["輪の写真・音・動画", "Circle photos, audio & video"], ["仲間の輪のカードの写真・音・動画は、輪の人だけが開ける鍵で封をしてから置き場に置きます。見せる相手は、写真などを選ぶ前に決めます。", "Circle photos, audio and video are sealed with a key only members can open before upload. Choose who can see before picking files."],
  ["長い動画・音", "Long video & audio"], ["動画も音も{#}時間まで（音は MP{#} の {#}〜{#}kbps と同じくらいの音質）。端末の中で軽くして、長いものは分けて置き、続けて{#}本として流れます。下の線を押すと、その所へ。", "Video and audio up to $1 hours (audio similar to MP3 256–320 kbps). Compressed on your device, split when long, and played as one. Tap the line below to jump."],
  ["動画・音を作る", "Making video & audio"], ["＋ → データ → 動画。選ぶと、その場で軽くして（進み具合が出ます）、そのまま出せます。リンク（YouTube など）も入れられます。", "+ → Data → Video. Pick a file and it's compressed right away (with progress) and ready to post. Links (YouTube etc.) work too."],
  ["はじめて開いたとき", "First launch"], ["運用版の最初の流れ：jeni とは（{#}枚・貝はまだ待っている）→ 大事な{#}つと名前 → 始める → 鍵を守る。参加して jeni が届くと、貝が動き出します。", "First-run flow: what jeni is (3 pages · the shell waits) → 3 essentials and your name → start → protect your key. When jeni arrives, the shell comes alive."],
  ["招待する（身内に）", "Invite (family & friends)"], ["わたしのカードの「招待する」。一度きりのリンクとQRを LINE などで送ります（{#}日間・{#}人・認められる{#}人に数える）。", "\"Invite\" on your card. Send a one-time link/QR by message ($1 days · $2 person · counts toward your $3)."],
  ["直す・取り下げる", "Edit & withdraw"], ["自分のカードのページから。値段・数・種類は直せません。取り下げると、だれも持っていなければ消え、持っている人がいれば受付を終えます。", "From your card's page. Price, quantity and type can't be edited. Withdrawing removes it if no one holds it, otherwise closes it."],

async function mediaJob(file, kind) {

  const word = kind === "music" ? "音を整えて置いています" : "動画を軽くして置いています";
  const onPart = (blob, i, n) => putFile(blob, f => setJob(100 * (i + .7 + .3 * f) / n, `${word}${n > 1 ? `（${i + 1}/${n}）` : ""}`));
  try {
    let r;
    try { r = await JeniMedia.prepare(file, kind, (p) => setJob(p * 100 * .7 + (JOB.pct > p * 70 ? 0 : 0), word), onPart); }
    catch (e) {
      if (!/Failed to fetch|import|module/i.test(String(e && e.message))) throw e;

      const dd = Math.round(d * 100) / 100;
      r = {parts: [{...(await onPart(file, 0, 1, dd)), d: dd, size: file.size}], dur: d, poster: null};
    }
    const parts = r.parts.map(({u, x, m, e, d, k, t}) => ({u, x, m, e, d, k, t}));
    const poster = r.poster ? await shrink(URL.createObjectURL(r.poster), 640) : "";

  } catch (e) { JOB.err = (e && e.message) || "できませんでした"; }

      <li><b>投げ銭</b>半分は作った人へ、半分は持っている人へ（鍵をかけて持っている人はのぞく：分け前の動きから、どのカードを持っているかが分かってしまうため）。受け取るとなくなるもの（現物など数に限りのあるカード）と、お店・会社や団体は、全額が作った人へ。プロジェクトは、半分を自分のカードをつないで育てた人で等しく分けます（仲間になるのは無料でだれでもなれるので、なっただけの人には分けません）。</li>
      <li><b>上限</b>同じカードは${RULE.capPaid}枚まで（無料のカードは${RULE.capFree}枚まで）。使うか贈ると、また持てます。</li>
    </ol>
        <p class="rnote"><b>会話・友達・知らせる</b>　カードの会話は、参加している人ならだれでも書けます（輪のカードは輪の人だけ）。2人だけの会話（写真・ファイル・カードも送れる）と通話（ビデオ通話も）は、お互いに友達のときだけ（残高の下の吹き出し、または相手のカードから）。危ないカードや会話は、実績のある別々の人${RULE.flagsToHide}人の知らせで隠れます。現物・イベント・体験は、持っている人が出す一度きりのQRを作った人が読んで、受け取り・参加・受けたことにします。</p>
    <p class="rnote"><b>QRは3つ</b>　どのQRも、読んだだけで jeni は動きません（読んだ人が自分の画面で長押ししたときだけ）。<br>
      ・カードの裏・プロフィールのQR：カードや人が開きます（紹介・友達になる・参加を認める）<br>
      ・QRで受け取る：作った人・売る人が出すQR。読んだ人の画面に「持つ」と「投げ銭」が出て、長押しすると jeni が出した人に届きます（その場で売るときは5分・1回だけ）<br>
      ・QRで引き換える（入る・受ける）：持っている人が出し、作った人が読むQR。現物の受け取り・入場・体験に<br>決まると、両方の画面の小さなカードが同じように光ります。招待は一度きりのリンクで送ります（QRにもできます）。</p>
    <p class="rnote"><b>直す・取り下げる</b>　作った人は、あとから題・説明・日時・場所・画像を直したり、アルバムに写真を足したり、動画や音を入れ替えたりできます（値段・数・種類は直せません）。取り下げると、だれも持っていないカードは消え、持っている人がいるカードは受付を終えます（持っている人のものはそのまま）。自分の書いた会話は消せます。直した・消したことは記録に残ります。</p>
    <p class="rnote"><b>見えるもの・隠れるもの</b>　だれがだれに何 jeni 払ったかは、確かめ合うために記録に残り、だれでも見られます（番号と、その人が決めた名前で）。見せ方は3つ：「みんなに見せる」、「かくす（分け前あり）」＝画面に出さないだけで記録を調べれば分かる・投げ銭の分け前を受け取れる、「鍵をかける（分け前なし）」＝どのカードかは本人と作った人にしか分からない（数に限りのないカードだけ・分け前が届くと分かってしまうので受け取らない）。仲間の輪の中身（写真・音・動画も）は、輪の人にしか読めません。ただし、輪の人が自分の端末に保存したり、輪から外れた人がそれまでに見たものを持っていたりすることは防げません。2人だけの会話・通話も同じで、相手の手元に残ることは防げません。</p>
    <p class="rnote"><b>贈る</b>　jeni や持っているカードを、参加している人に直接届けられます（残高の下の贈り物の印か、相手のプロフィールカードから・長押しで決める）。贈ると取り消せません。だれからだれへ何を贈ったかは記録に残ります。</p>
    <p class="rnote"><b>配る量について</b>　配る量や配り方は、使われ方を見て変わることがあります。変わるときも全員に同じきまりが同じように当てはまり、前もって知らせます。jeni は円と交換できず、値段は作った人が決めるので、配る量の大きさそのものに意味はありません。</p>
    <p class="rnote"><b>運営のサーバーはありません</b>　記録は、だれでも立てられる複数の中継（リレー）に置き、それぞれの端末にも写しを持ちます。1か所が止まっても、ほかに残ります。無料の中継は古い記録を消すことがあるので、記録の書き出しで守ります。また毎日、記録の「指紋」（中身は分からない64文字）をビットコインに刻み、日付をさかのぼった書き換えができないようにしています。</p>
    </details>`);
}

let POS = null; const posLoad = () => POS || (POS = (LIVE ? LV.store.get("jeni.pos", {}) : {}));

}

    navigator.mediaSession.metadata = new MediaMetadata({title: c.title || "jeni", artist: nameOf(c.by), album: "jeni", artwork: m.img ? [{src: m.img, sizes: "640x404", type: "image/jpeg"}] : []});

  const fresh = clock - e.created_at < 60;
  if (d.ty === "offer" && fresh && !RTC.pc) { RTC.inc = {from: e.pubkey, cid: d.cid, sdp: d.sdp, video: !!d.video}; setTimeout(() => incomingCall(), 0); return; }
  if (d.cid !== RTC.cid || !RTC.pc) { if (d.ty === "ice" && RTC.inc && RTC.inc.cid === d.cid) RTC.pend.push(d.c); if (d.ty === "end" && RTC.inc && RTC.inc.cid === d.cid) { RTC.inc = null; closeOver(); } return; }
  if (d.ty === "answer") RTC.pc.setRemoteDescription({type: "answer", sdp: d.sdp}).catch(() => {});
  if (d.ty === "ice") RTC.pc.addIceCandidate(d.c).catch(() => {});
  if (d.ty === "end") { rtcEnd(false); closeOver(); toast("通話が終わりました"); }
}
function incomingCall() {
  const i = RTC.inc; if (!i) return;
  openOver(`<div class="call"><div class="pav2">${esc(nameOf(i.from).slice(0, 1))}</div><b>${esc(nameOf(i.from))}</b><span class="sub" id="call-s">${i.video ? "ビデオ通話" : "電話"}がかかってきています</span>
    <div class="row2">${i.video ? `<button type="button" class="pill go" data-pickup="v">ビデオで出る</button><button type="button" class="pill" data-pickup="a">声だけで出る</button>` : `<button type="button" class="pill go" data-pickup="a">出る</button>`}<button type="button" class="pill warn" data-decline>出ない</button></div></div>`);
}
async function rtcAnswer(video = false) {
  const i = RTC.inc; if (!i) return; RTC.inc = null;
  if (i.video) openOver(vcallHtml(i.from, video ? "" : "声だけで出ています（相手の映像は見えます）"));
  try { RTC.stream = await navigator.mediaDevices.getUserMedia({audio: true, video: video ? camOpt : false}); } catch (x) { toast(video ? "カメラかマイクを使えません" : "マイクを使えません"); return; }
  showMe();
  RTC.peer = i.from; RTC.cid = i.cid; RTC.pc = rtcPc(i.from);
  RTC.stream.getTracks().forEach(t => RTC.pc.addTrack(t, RTC.stream));
  await RTC.pc.setRemoteDescription({type: "offer", sdp: i.sdp});
  for (const c of RTC.pend.splice(0)) RTC.pc.addIceCandidate(c).catch(() => {});
  const ans = await RTC.pc.createAnswer(); await RTC.pc.setLocalDescription(ans);
  await sendCall(i.from, {cid: i.cid, ty: "answer", sdp: ans.sdp});
  if (i.video) { const s = $("call-s"); if (s) s.textContent = "つないでいます…"; return; }
  openOver(`<div class="call"><div class="pav2">${esc(nameOf(i.from).slice(0, 1))}</div><b>${esc(nameOf(i.from))}</b><span class="sub" id="call-s">つないでいます…</span><button type="button" class="pill warn" data-hang="${i.from}">終える</button></div>`);
}
function rtcEnd(tell = true) {
  if (tell && RTC.peer && RTC.cid) sendCall(RTC.peer, {cid: RTC.cid, ty: "end"});
  try { RTC.pc && RTC.pc.close(); } catch (x) {} try { RTC.stream && RTC.stream.getTracks().forEach(t => t.stop()); } catch (x) {}
  RTC.pc = null; RTC.stream = null; RTC.cid = null; RTC.peer = null;
}

/* ---- QR を読む（読めるブラウザではカメラで。読めないときは、スマホのカメラで読むか、番号を入れる） ---- */
let scanStream = null, scanLoop = null;
async function scanSheet() {
  openOver(`<h2 class="rh">QRを読む</h2><p class="sub">カード・人を開くQR、「QRで受け取る」「QRで引き換える」のQRを読めます。読んだだけで jeni は動きません。</p>

    <p class="sub" id="scan-m" style="font-size:12px"></p>
    <label class="fl">読めないときは、QRの下の文字を入れる<input id="scan-t" placeholder="https://… または番号"></label><button type="button" class="pill go" data-scantext>読む</button>`);
  const m = $("scan-m");
  if (!("BarcodeDetector" in window)) { m.textContent = "このブラウザはカメラで読めません。スマホのカメラアプリで読むと、そのまま jeni が開きます。"; return; }

  } catch (x) { m.textContent = "カメラを使えません。スマホのカメラアプリで読むか、下に入れてください。"; }
}
function scanStop() { clearInterval(scanLoop); scanLoop = null; try { scanStream && scanStream.getTracks().forEach(t => t.stop()); } catch (x) {} scanStream = null; }
// QR の中身（または開いたリンク）：開く（#card= カード・#me= 人）・払う（#pay=カード＝持つ・投げ銭／#pay=カード.番号＝その場で売る）・受け取る（#used=）・招待（#join=）・はじまり（#genesis=）。#tip= と #hold= は前の形（払うと同じ画面）
function onScan(text) {
  const m = String(text || "").match(/#(me|card|pay|used|join|genesis|tip|hold)=([0-9a-zA-Z.]+)/); if (!m) return toast("jeni のQRではありません");
  return handleLink(m[1], m[2]);
}
function handleLink(kind, val) {
  if (!LV.me) { PENDING = [kind, val]; return startSheet(); }
  const [a, b2, c3] = val.split(".");
  if (kind === "card") { if (S.cards[a]) return detail(a); return toast("カードを探しています…（まだ届いていません）"); }
  if (kind === "tip" || kind === "hold" || (kind === "pay" && !b2)) { if (!S.cards[a]) { PENDING = [kind, val]; return toast("カードを探しています…（まだ届いていません）"); } return quickSheet(a); }
  if (kind === "me") {
    if (a === me) return meCard();
    const u = S.users[a];
    if (U().member && (!u || !u.member)) return confirmVouch(a);
    return personCard(a);
  }
  if (kind === "pay") { const c = S.cards[a]; if (!c) { PENDING = [kind, val]; return toast("カードを探しています…"); } return buySheet(a, b2); }
  if (kind === "used") { const c = S.cards[a]; if (!c || c.by !== me) return toast("自分のカードの受け取りだけ読めます"); return useCode(a, b2); }
  if (kind === "join") return joinWith(a, c3);
  if (kind === "genesis") { emit(me, {t: "genesis", code: a}); if (U().member) { home(); return joined(); } return toast("はじまりの番号が合いません（もう始まっています）"); }
}
let PENDING = null;
function confirmVouch(pk) {
  openOver(`<h2 class="rh">この人を認める</h2><p class="sub">${esc(nameOf(pk))} さん（${pk.slice(0, 8)}…）を認めて参加してもらいます。${RULE.start.toLocaleString("ja-JP")} jeni が届きます。あなたが認められるのは${RULE.vmax(U())}人まで（あと${Math.max(0, RULE.vmax(U()) - U().vouched.length)}人）。会ったことのある人だけにしてください。</p>
    <button type="button" class="big" data-vouch="${pk}">認める</button>`);
}
function useCode(id, code) {
  const c = S.cards[id], x = c.copies.find(y => !y.used && y.redeem && y.redeem.lock === sha256hex(code));
  if (!x) return toast("受け取りの番号が合いません（期限切れか、使い終わり）");
  emit(me, {t: "used", card: id, holder: x.owner, code});
  const ok = S.cards[id].copies.some(y => y.owner === x.owner && y.used); refreshPageSafe(id);
  return toast(ok ? `${nameOf(x.owner)} さんの受け取りを記録しました` : "記録できませんでした");
}
function refreshPageSafe(id) { if ($("pg-" + id)) refreshPage(id); else detail(id); }
function buySheet(id, code) {

    ${lpBtn("buy", id + "." + code, `${coin()}${c.price} jeni<small>長押しで払う</small>`, "go big")}

function joinWith(inviteId, code) {

function afterStart(fresh = false) {
