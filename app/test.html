<title>jeni テスト版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark light">
<style>
/* jeni テスト版（つながない）。出来事はこの端末の中だけで計算し、どこにも送らない。何人かを切り替えて、きまりどおりに動くかを確かめる */
:root{
  --bg:#0f1411; --card:#171e19; --sunk:#1f2822; --ink:#e7ede8; --mute:#8fa094; --line:#2b372f;
  --gold:#e2c06b; --gold-ink:#1a1608; --leaf:#7fbf8a; --leaf-soft:#1f3326; --warn:#e8a07a;
  --t-rwa:#1d2a1f; --t-media:#1b1f2e; --t-text:#2a2219;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#efe9dc; --card:#f8f4ea; --sunk:#e6dfcf; --ink:#2b261c; --mute:#7a705d; --line:#d8cfbb;
  --gold:#a87a1e; --gold-ink:#fffaf0; --leaf:#3f7a4c; --leaf-soft:#dde9da; --warn:#b4552a;
  --t-rwa:#e9ecdc; --t-media:#e3e4ea; --t-text:#efe3d1; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#efe9dc; --card:#f8f4ea; --sunk:#e6dfcf; --ink:#2b261c; --mute:#7a705d; --line:#d8cfbb;
  --gold:#a87a1e; --gold-ink:#fffaf0; --leaf:#3f7a4c; --leaf-soft:#dde9da; --warn:#b4552a;
  --t-rwa:#e9ecdc; --t-media:#e3e4ea; --t-text:#efe3d1; color-scheme:light;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,.line:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.coin{display:inline-block;width:1.2em;height:1.15em;vertical-align:-.22em;flex:none;color:var(--ink);filter:drop-shadow(0 0 3px rgba(226,182,78,.55))}
.lp.go .coin,.pill.go .coin,.big .coin{color:currentColor;filter:none}

/* テスト版の帯：だれとして見ているか */
.tbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.tbar .tag{border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
.tbar label{display:flex;align-items:center;gap:6px;margin-left:auto}
.tbar select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;min-height:32px}
.tbar .reset{border:0;background:none;color:var(--mute);text-decoration:underline;padding:4px}

/* プロフィールカード（メニューを兼ねる） */
.me{aspect-ratio:1.586;max-width:100%;border-radius:18px;background:var(--card);border:1px solid var(--line);padding:16px 16px 10px;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;overflow:hidden}
.me-top{display:flex;align-items:center;gap:10px;min-width:0}
.me-top>div:nth-child(2){min-width:0}
.av{width:42px;height:42px;border-radius:28%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.14);background-size:cover;background-position:center;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-weight:700;flex:none}
.me-name{font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-line{font-size:12px;color:var(--mute)}
.bal{margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.bal small{font-size:12px;color:var(--mute);font-weight:600}
.me-mid{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-height:0}
.pmark{border:0;background:none;padding:4px;color:var(--gold);border-radius:10px;animation:glow2 3.6s ease-in-out infinite}
.pmark svg{display:block;overflow:visible}
.pmark .halo{stroke:transparent}
@keyframes glow2{0%,100%{filter:drop-shadow(0 0 1px rgba(226,182,78,.3))}50%{filter:drop-shadow(0 0 6px rgba(226,182,78,.9))}}
.menu-w{display:flex;align-items:end;gap:4px;align-self:end;min-width:0}
.menu{position:relative;flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:18px}
.menu::-webkit-scrollbar{display:none}
.menu button{flex:0 0 max(34px, calc((100% - 24px) / 6.5))}
.menu-w .make{flex:0 0 auto;width:max(34px, calc((100% - 28px) / 7.5));aspect-ratio:1;border:0;border-radius:12px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;padding:0}
.me-r{margin-left:auto;display:grid;justify-items:end;gap:4px}
.me-line{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:360px){.me{padding:12px 12px 8px;gap:4px}.pmark svg{width:42px;height:auto}.cb{width:26px;height:26px}.comm{gap:2px}.me-top .av{width:34px;height:34px}.me-name{font-size:15px}.bal{font-size:15px}}
.me-r .bal{margin-left:0}
.comm{display:flex;gap:6px}
.cb{position:relative;width:30px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--mute);display:grid;place-items:center;padding:0}.cb svg.i{width:17px;height:17px}
.cb b{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:#e0604f}
.menu button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--mute);display:grid;place-items:center;padding:0}
.menu button[aria-pressed="true"]{background:var(--leaf);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.mcap{font-size:10px;line-height:1.2;color:var(--mute);opacity:.85;padding:0 2px;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.mcap b{color:var(--leaf);font-weight:700}
.dist{flex:none;font-weight:700;color:var(--leaf);font-size:11px;margin-right:2px;white-space:nowrap}
.fv svg.i{fill:#e0a92e;stroke:#e0a92e}
.cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);padding:0 4px}
.notice{background:var(--leaf-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.notice b{color:var(--leaf)}

/* 一覧：小さな行 */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{position:relative;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.line{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.th{width:52px;height:52px;border-radius:12px;border:0;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;background:var(--sunk);color:var(--mute)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th[data-k="music"],.th[data-k="video"]{background:var(--t-media);color:var(--ink)}
.th[data-k="text"]{background:var(--t-text)} .th[data-k="rwa"]{background:var(--t-rwa)}
.th .pl{position:absolute;inset:auto 4px 4px auto;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.th .pl svg.i{width:12px;height:12px;fill:currentColor;stroke:none}
.mid{min-width:0}
.t{font-weight:700;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);min-width:0;margin-top:2px}
.s svg.i{width:14px;height:14px}
.s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .left{color:var(--leaf);font-weight:700;flex:none}
.s .lk{color:var(--gold);flex:none}
.hold{display:flex;align-items:center;gap:4px;border:0;border-radius:999px;min-height:36px;padding:0 12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--leaf);color:var(--bg);white-space:nowrap}
.hold .lb{font-size:11px;font-weight:600;opacity:.85;margin-right:2px}
.hold.free{background:transparent;border:1px solid var(--leaf);color:var(--leaf)}
.bar{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.empty{color:var(--mute);text-align:center;padding:28px 12px;margin:0;font-size:13px}
@media (max-width:360px){.line{gap:10px;padding:10px}.line .hold{padding:0 10px}}

/* 詳細・作る画面（シート） */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--leaf);font-weight:700;padding:6px 0;min-height:40px}
.rh{font-size:20px;margin:6px 2px 2px}
.sub{margin:0 2px;font-size:13px;color:var(--mute)}
.acts2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acts2 .mine{margin-right:auto;font-size:12px;color:var(--mute)}
.pill{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.go{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.pill.warn{color:var(--warn)}
.flow{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:8px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:13px;line-height:1.6}
.flow dt{color:var(--mute)} .flow dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.flow small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.box h3{font-size:13px;color:var(--mute);margin:0 0 6px;font-weight:600}
.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px}
.kv dt,.kv dd{padding:8px 0;border-top:1px solid var(--line);margin:0;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv>:nth-child(-n+2){border-top:0}
.who-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.who-row:first-of-type{border-top:0}
.who-row span{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-row .pill{min-height:34px;font-size:13px;padding:0 12px}
.preview{border-radius:14px;overflow:hidden;background:var(--sunk)}
.preview img,.preview video{width:100%;display:block}
.preview.small img{filter:blur(6px) saturate(.9);transform:scale(1.05)}
.preview p{margin:0;padding:12px 14px;font-size:14px;line-height:1.8;background:var(--t-text)}
.preview audio{width:100%;display:block}
.lockmsg{font-size:12px;color:var(--mute);padding:8px 14px;display:flex;gap:6px;align-items:center}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);cursor:pointer}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--leaf)}
.opt b{font-size:14px} .opt small{grid-column:2;font-size:12px;color:var(--mute);line-height:1.5}
.opt.off{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;min-height:36px;font-size:14px;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.fl{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.fl input,.fl textarea,.fl select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.fl textarea{min-height:80px;resize:vertical}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:999px;padding:4px}
.tabs button{border:0;border-radius:999px;background:none;min-height:36px;font-weight:700;font-size:14px;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.ph-pick{position:relative;display:grid;place-items:center;aspect-ratio:1.586;border-radius:18px;border:2px dashed var(--line);background:var(--sunk) var(--img,none) center/cover;color:var(--mute);font-weight:700;cursor:pointer;overflow:hidden}
.ph-pick.has{border-style:solid}
.ph-pick:not(.has){aspect-ratio:3}
.ph-pick.mp{aspect-ratio:auto;min-height:64px}
.ph-pick.mp.has span{background:none;color:var(--leaf);align-self:center;margin:0}
.ph-pick.has span{background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;align-self:end;margin-bottom:12px}
.ph-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph-pick:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.big{border:0;border-radius:999px;min-height:48px;font-weight:700;background:var(--leaf);color:var(--bg);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.big.ghost{background:transparent;border:1px solid var(--leaf);color:var(--leaf)}
.qrbox{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;justify-items:center}
.qrwrap{position:relative;width:min(100%,260px)}
.qrwrap svg.q{width:100%;display:block;border-radius:8px;transition:opacity .4s}
.ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none}
.ring rect{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.who-sees{margin:4px 0 0;padding:8px 12px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:13px}
.done{display:grid;justify-items:center;gap:6px;text-align:center;padding-top:16px}
.done .coin{width:84px;height:80px;transform-origin:50% 90%;animation:nup 1.1s cubic-bezier(.34,1.3,.5,1) both, shine 3.6s ease-in-out 1.2s infinite}
/* ぬっぽり：下からふくらみ、少しつぶれて、ゆっくり落ち着く */
@keyframes nup{0%{transform:translateY(14px) scale(.2,.15);opacity:0}45%{transform:translateY(-4px) scale(1.12,.9);opacity:1}70%{transform:translateY(0) scale(.95,1.06)}100%{transform:none}}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 2px rgba(226,182,78,.35))}50%{filter:drop-shadow(0 0 10px rgba(226,182,78,.9))}}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:grid;gap:8px}
.rules li{counter-increment:r;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 44px;position:relative;font-size:14px;line-height:1.7}
.rules li::before{content:counter(r);position:absolute;left:14px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-size:12px;font-weight:700;display:grid;place-items:center}
.rules b{display:block}
.rnote{margin:0;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:13px;line-height:1.8;color:var(--mute)}
.rnote b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
/* 1枚ずつ上下にめくる */
.sheet.feed{scroll-snap-type:y proximity;padding-top:0;padding-bottom:0}
.sheet.feed>.wrap{gap:0}
.ftop{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) 0 6px;background:linear-gradient(var(--bg) 70%,transparent)}
.ftop .imm-b{border:0;background:none;color:var(--mute);font-size:12px;text-decoration:underline;text-underline-offset:3px;min-height:36px}
/* 全画面：カードだけ。押すものは隠す（もどすで戻る） */
.sheet.imm{background:#000}
.sheet.imm .pg{justify-content:center;gap:0}
.sheet.imm .pg>:not(.jc2){display:none}
.sheet.imm .ftop{background:none}
.sheet.imm .ftop .back{visibility:hidden}
.pg{min-height:calc(100dvh - 52px);scroll-snap-align:start;scroll-margin-top:52px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 0 28px}
.pg .acts2{min-height:48px}
.fline{margin:0 2px;font-size:12px;color:var(--mute);line-height:1.6}
.note1{margin:0 2px;font-size:14px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pg .body{margin:0;padding:12px 14px;border-radius:14px;background:var(--t-text);font-size:14px;line-height:1.9;max-height:34dvh;overflow:auto}
.recv{display:flex;flex-wrap:wrap;gap:8px}
.more{border-top:1px solid var(--line);padding-top:6px}.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);padding:6px 2px}.more>summary::-webkit-details-marker{display:none}.more>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px;transition:transform .2s}.more[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}.more[open]{display:grid;gap:10px}
.own{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.minor{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--mute)}
button.link{border:0;background:none;color:var(--leaf);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font:inherit;font-size:13px;cursor:pointer}
.who-row .link{color:inherit;padding:0;font-size:inherit}
.minor .link{border:0;background:none;padding:6px 0;color:var(--leaf);font-size:12px;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.tipbox{display:grid;gap:8px;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.lp{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font-weight:700;font-size:15px;white-space:nowrap;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lp.go{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.lp small{font-size:11px;font-weight:600;opacity:.8}
.lp i{position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:left;transition:transform .15s ease-out;pointer-events:none}
.lp.pressing i{transform:scaleX(1);transition:transform 1s linear}
.tipbox .lp{justify-self:start}
.jc2 .cplay{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:14cqw;height:14cqw;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.jc2 .cplay svg.i{width:6cqw;height:6cqw;fill:currentColor;stroke:none}
.jc2 .cplay.on{background:rgba(226,182,78,.85);color:#1a1608}
.jc2 .cview{position:absolute;inset:0 30% 30% 0;border:0;background:none;padding:0}
.jc2 .cbar{position:absolute;left:0;right:0;bottom:0;height:.9cqw;background:rgba(255,255,255,.15)}
.jc2 .cbar i{display:block;height:100%;width:0;background:#e2b64e}
.jc2 video.inplay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 下から出る記録 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
.over{position:fixed;left:0;right:0;bottom:0;z-index:26;max-height:82dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;display:grid;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px -10px rgba(0,0,0,.5)}
.over>*{max-width:440px;width:100%;justify-self:center}
.over .grab{width:40px;height:4px;border-radius:2px;background:var(--line)}
.over .x{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:8px;width:36px;height:36px;border:0;background:none;color:var(--mute);font-size:22px}
.bigimg{width:100%;border-radius:14px;display:block}
.warnc{color:var(--warn)!important}
.mk-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.mk-g button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 2px;display:grid;justify-items:center;gap:4px;font:inherit;font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}.mk-g button svg.i{width:22px;height:22px}.mk-g button[aria-pressed="true"]{background:var(--leaf);color:#fff;border-color:transparent}
.mk-k{display:flex;flex-wrap:wrap;gap:6px}.mk-k button{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px 6px 8px;font:inherit;font-size:13px}.mk-k button svg.i{width:16px;height:16px}.mk-k button[aria-pressed="true"]{background:var(--leaf-soft);color:var(--leaf);border-color:var(--leaf);font-weight:700}
.hmap{padding:0 2px}
.map{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);touch-action:manipulation}.map.pick{cursor:crosshair}
.map .mbg{fill:#eef1e6}.map .mgrid{stroke:#dfe5d4;stroke-width:.3}.map .msea{fill:#dbe8ee}.map .mpin path{fill:#d63a2b}.map .mpin circle{fill:#fff}.map .mpin text{font:3.2px sans-serif;fill:#3b3a30;paint-order:stroke;stroke:#fff;stroke-width:.8px}.map .mpin[data-detail]{cursor:pointer}.map .mnote{font:2.6px sans-serif;fill:#8a8a7a}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.who{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;margin-right:auto;min-width:0;font-size:13px;color:var(--ink)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:7em}
.avs{width:28px;height:28px;border-radius:28%;display:inline-grid;place-items:center;background:var(--leaf-soft) center/cover;color:var(--leaf);font-style:normal;font-weight:700;font-size:12px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.12)}
.avs.sm{width:16px;height:16px;font-size:9px;border-radius:28%}.wt{display:inline-flex;align-items:center;gap:5px;min-width:0}
.friends{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;flex:none;min-height:36px}
.fchip small svg.i{width:14px;height:14px;color:var(--leaf)}
.pjk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.pjk dd .link{border:0;background:none;padding:0;color:var(--leaf);font-size:inherit;text-decoration:underline}
.minor .pill{min-height:36px;font-size:13px;margin-right:6px}
.talk{display:grid;gap:8px;max-height:46dvh;overflow:auto;align-content:start}
.nb{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e0604f;flex:0 0 auto;vertical-align:middle}
.crow{flex:1;min-width:0;border:0;background:none;text-align:left;display:grid;gap:2px;padding:4px 0;font:inherit;color:inherit}.crow small{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px}
.cm b{font-size:13px} .cm p{margin:2px 0 0;line-height:1.7;overflow-wrap:anywhere}
.cm .hb{font-size:10px;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.cm .link{border:0;background:none;padding:2px 0;font-size:11px;text-decoration:underline}
.cm .link.nm{font-size:13px;font-weight:700;text-decoration:none;color:inherit;padding:0}
.cm.hid{color:var(--mute);font-size:12px}
.say{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.say textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:44px;max-height:120px;resize:vertical;min-width:0}
.chat .bub{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;justify-self:start;overflow-wrap:anywhere}
.chat .bub.me{justify-self:end;background:var(--leaf-soft)}
.call{display:grid;justify-items:center;gap:10px;padding:24px 0}
.pav2{width:84px;height:84px;border-radius:28%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-size:32px;font-weight:700;animation:shine 2.4s ease-in-out infinite}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;text-align:left;font-size:14px}
.mini:first-of-type{border-top:0}
.mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .mini small{color:var(--mute);font-size:12px}
.pj .link{border:0;background:none;padding:6px 0;color:var(--leaf);font-size:13px;text-decoration:underline}
.form{display:grid;gap:10px}
.guide{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:24;border:1px dashed var(--gold);background:var(--card);color:var(--gold);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;min-height:34px;box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.gl{display:grid;gap:8px}
.gi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gi .n{width:24px;height:24px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font-size:12px;font-weight:700}
.gi b{font-size:14px} .gi small{grid-column:2/4;font-size:12px;color:var(--mute);line-height:1.5}
.gi .pill{min-height:34px;font-size:13px}

/* カード（1.586）：中身はカードいっぱい、情報はその上。持っているときだけ黄金らせんの印が現れて光る */
.jc2{container-type:inline-size;aspect-ratio:1.586;max-width:100%;position:relative;perspective:1400px}
.jc2 .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.jc2.on .in{transform:rotateY(180deg)}
.jc2 .face{position:absolute;inset:0;border-radius:5.2cqw;overflow:hidden;color:#1f1b14;backface-visibility:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 12px 26px -14px rgba(0,0,0,.6)}
.jc2 .back{transform:rotateY(180deg)}
.jc2 .paper,.jc2 .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.jc2 .gfield{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.jc2 .gfield path{vector-effect:non-scaling-stroke}
.jc2 .shade{position:absolute;inset:0;pointer-events:none}
.jc2 .face[data-ink="l"] .shade{background:linear-gradient(180deg,rgba(0,0,0,var(--tc,.28)),rgba(0,0,0,0) 26%,rgba(0,0,0,0) 44%,rgba(0,0,0,var(--sc,.5)))}
.jc2 .face[data-ink="d"] .shade{background:linear-gradient(180deg,rgba(255,255,255,var(--tc,.4)),rgba(255,255,255,0) 26%,rgba(255,255,255,0) 44%,rgba(255,255,255,var(--sc,.55)))}
.jc2 .face[data-busy]{--sc:.85;--tc:.7}
.jc2 .face[data-ink="l"]{--ink:#fff;--halo:rgba(0,0,0,.55)} .jc2 .face[data-ink="d"]{--ink:#1f1b14;--halo:rgba(255,255,255,.75)}
.jc2 .txt,.jc2 .jno,.jc2 .excerpt{color:var(--ink);text-shadow:0 0 1px var(--halo),0 0 2px var(--halo),0 1px 10px var(--halo)}
.jc2 .txt{position:absolute;left:6cqw;right:24cqw;bottom:5.4cqw}
.jc2 .k{font-size:3cqw;letter-spacing:.08em;opacity:.85}
.jc2 .t{font-size:6cqw;font-weight:700;line-height:1.3;white-space:normal;overflow:visible;text-wrap:balance}
.jc2 .by{font-size:3.4cqw;opacity:.85}
.jc2 .jno{position:absolute;left:6cqw;top:5cqw;font-size:2.8cqw;letter-spacing:.14em;opacity:.8}
.jc2 .excerpt{position:absolute;left:6cqw;right:8cqw;top:13cqw;margin:0;font-size:3.6cqw;line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.jc2 .mark{position:absolute;right:5.4cqw;bottom:5cqw;width:15cqw;border:0;background:none;padding:0;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s}
.jc2.held .mark{opacity:1;pointer-events:auto}
.jc2 .mark svg{display:block;width:100%;height:auto;overflow:visible}
.jc2 .mark .halo{stroke:var(--halo)}
.jc2 .ln{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .25s ease}
.jc2.drawing .mark{opacity:1}
.jc2.drawing .ln{stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.jc2.held .ln{stroke-dashoffset:0}
.jc2.held .mark svg{animation:glow 3.6s ease-in-out 1.2s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 .3cqw rgba(226,182,78,.35))}50%{filter:drop-shadow(0 0 1.8cqw rgba(226,182,78,1))}}
.jc2 .qr{position:absolute;left:6cqw;top:50%;transform:translateY(-50%);width:44cqw;height:44cqw}
.jc2 .qr svg{width:100%;height:100%;display:block}
.jc2 .bk{position:absolute;left:55cqw;right:6cqw;top:7.5cqw;bottom:7cqw;display:flex;flex-direction:column;gap:1.6cqw;color:#1f1b14}
.jc2 .bk .no{font-size:3.2cqw;color:#7a705d;letter-spacing:.1em}
.jc2 .bk .bt{font-size:4.6cqw;font-weight:700;line-height:1.35}
.jc2 .bk .how{font-size:3.1cqw;color:#5e5546;line-height:1.5}
.jc2 .wback .qr{left:5cqw;width:33cqw;height:33cqw;top:7cqw;transform:none}.jc2 .wback .bk{left:43cqw;right:5cqw;top:6cqw;bottom:5cqw}.jc2 .wal{margin-top:auto;height:24cqw;display:grid;grid-template-rows:auto 1fr;gap:1.4cqw}.jc2 .wal .wh{display:flex;align-items:center;gap:1.2cqw;font-size:3cqw;font-weight:700;color:#3b352a}.jc2 .wal .wh svg.i{width:4.2cqw;height:4.2cqw}.jc2 .wal .wh span{font-weight:500;font-size:2.5cqw;color:#8a7f6a;border:1px solid #cbbf9f;border-radius:99px;padding:0 1.4cqw}.jc2 .wal .wb{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}.jc2 .wal .wb button{display:grid;place-items:center;align-content:center;gap:.8cqw;border:1px solid #cbbf9f;background:rgba(255,255,255,.55);color:#8a7f6a;border-radius:3.2cqw;font:inherit;font-size:3.1cqw;font-weight:700;padding:0}.jc2 .wal .wb svg.i{width:5cqw;height:5cqw}
.jc2 .bk dl{margin:auto 0 0;display:grid;grid-template-columns:auto 1fr;column-gap:2.4cqw;font-size:3.2cqw;line-height:1.6}
.jc2 .bk dt{color:#7a705d} .jc2 .bk dd{margin:0;overflow-wrap:anywhere}
.jc2 .pav{position:absolute;left:6cqw;top:12cqw;width:15cqw;height:15cqw;border-radius:28%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.25);background-size:cover;background-position:center;display:grid;place-items:center;background:#3f7a4c;color:#fff;font-weight:700;font-size:6cqw}
.jc2 .circ{margin-left:2cqw;font-size:2.6cqw;padding:.4cqw 1.8cqw;border-radius:99cqw;background:rgba(0,0,0,.45);color:#fff;letter-spacing:.06em}
.jc2 .pcomm{position:absolute;right:4.4cqw;bottom:4.4cqw;display:flex;gap:2cqw}.jc2 .pcomm button{width:10cqw;height:10cqw;border:0;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}.jc2 .pcomm svg.i{width:5cqw;height:5cqw}
.jc2 .cfav{position:absolute;right:calc(4.4cqw + 15cqw);top:3.6cqw;width:9cqw;height:9cqw;border:0;border-radius:50%;background:rgba(0,0,0,.32);color:#fff;display:grid;place-items:center;padding:0}.jc2 .cfav svg.i{width:4.6cqw;height:4.6cqw}.jc2 .cfav.on svg.i{fill:#f2c14e;stroke:#f2c14e}
.jc2 .ctalk{position:absolute;right:4.4cqw;top:3.6cqw;display:flex;align-items:center;gap:1cqw;border:0;background:rgba(0,0,0,.32);color:#fff;border-radius:99cqw;padding:1.2cqw 2.4cqw;font-size:3cqw;min-height:9cqw}
.jc2 .ctalk svg.i{width:4.4cqw;height:4.4cqw}
.jc2 .ctalk span:empty{display:none}
@media (prefers-reduced-motion: reduce){.done .coin{animation:none}.lp.pressing i{transition:none}.jc2 .in,.jc2 .ln,.ring rect{transition:none}.jc2.held .mark svg,.pmark,.done .coin{animation:none}.toast{transition:none}}
</style>

<button type="button" class="guide" id="guide" data-guide aria-label="変わったところを見る">変わったところ</button>
<audio id="player" preload="none"></audio>

<script>// jeni の決まり（試験版）。署名つきの出来事（イベント）の並びから、だれが計算しても同じ状態になる。
// 運営もサーバーもいない。決まりに合わない出来事は、どの画面でも同じように無視される。
//
// jeni の5つのきまり
//  1 はじまり：認められて参加すると、決まった量の jeni が届く（jeni が新しく生まれるのはここだけ）
//  2 持つ　　：持つと、カードに書かれたものを受け取れる。作った人から持つと、値段の分の jeni が作った人へ。値段はずっと変わらない
//             （デジタルは元のデータを何度でも。現物はそのものを1回。受け取るとなくなるものは「使った」になる）
//  3 譲る　　：数に限りのあるカードは、持っている人から同じ値段で譲り受ける。jeni は手放した人へ
//  4 投げ銭　：半分は作った人へ、半分は持っている人へ（枚数に応じて）。受け取るとなくなるもの（数に限りのあるカード）と、つなぐカードは全額が作った人へ
//  5 上限　　：同じカードは3枚まで（無料のカードは1枚まで）。使うか贈ると、また持てる
"use strict";
(function (root) {
  const R = {
    version: 1,         // きまりの版。出来事には {v: 版} を付ける。版のない出来事は 1 とみなす。知らない（新しすぎる）版は読まない
    start: 1000,        // 参加したときに届く jeni（配る量は使われ方を見て変わることがある。変わるときも全員に同じきまり）
    vouchMax: 3,        // 1人が認められる人数
    capPaid: 3,         // 同じカードを持てる数
    capFree: 1,         // 無料のカードを持てる数
    priceMax: 1000000,
    tipMax: 1000000,
    futureSkew: 600,    // 未来の時刻の出来事は、この秒数より先なら無視する
    saleMax: 600,       // その場で売るカードの QR が使える長さ（秒）の上限
    founders: [],       // 最初の人たち（だれにも認められずに参加できる）。試験のはじめに決める
    flagsToHide: 2,     // 危ないカード・会話を隠すのに要る知らせの数（実績のある別々の人から）
    redeemMax: 600,     // 現物を引き換える QR が使える長さ（秒）の上限
    commentMax: 500,
  };
  const KINDS = ["rwa", "event", "service", "music", "video", "picture", "text", "app", "shop", "org", "project", "other"];
  // つなぐカード：ほかのカードを束ねる。プロジェクトはだれでも自分のカードをつなげる。お店・会社や団体は、作った人だけが自分のカードをつなぐ
  const BUNDLE = ["project", "shop", "org"], OPEN_BUNDLE = ["project"];
  const COUNTED = ["rwa", "event", "service"];   // 数があるもの（持った人に1回）。イベントの定員・サービスの枠もいる
  const AT = ["rwa", "event", "service", "shop"];   // 日時・場所・地図の点（受け取る場所・会場・お店）を持てるもの
  // カードの裏の QR を読んだときに開くもの。作った人が選べるのは jeni の中の決まった画面だけ（外のリンクにはしない：にせの画面へ誘う悪用を防ぐ）
  const QR = ["open", "tip", "hold", "orig"];   // app：持つと使えるアプリ（持っているかは、アプリの側が署名で確かめる）
  const isHex = (s, n) => typeof s === "string" && new RegExp(`^[0-9a-f]{${n}}$`).test(s);
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";

  // 小さな SHA-256（その場で売るときの「一度きりの番号」を確かめるため。計算は同期で、どの画面でも同じ）
  function sha256hex(text) {
    const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
    const bytes = Array.from(new TextEncoder().encode(text)), len = bytes.length * 8;
    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (len >>> (i * 8)) & 255);
    let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const r = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < bytes.length; o += 64) {
      const w = new Array(64);
      for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
      for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h = h.map((v, i) => (v + [a, b, c, d, e, f, g, hh][i]) | 0);
    }
    return h.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
  }

  function reduce(events, now, opt = {}) {
    const founders = new Set(opt.founders || R.founders);
    const evs = events.filter(e => e && e.created_at <= now + R.futureSkew).slice()
      .sort((a, b) => a.created_at - b.created_at || (a.id < b.id ? -1 : 1));
    const S = {users: {}, cards: {}, circles: {}, comments: {}, log: []};
    const U = pk => S.users[pk] || (S.users[pk] = {pk, name: "", member: false, bal: 0, vouchedBy: null, vouched: [], joinedAt: null, deals: 0, friends: []});
    // 実績：持った・持たれた・譲った・譲られたことが1回でもある人（知らせを出せるのはこの人たち）
    const trusted = pk => S.users[pk] && S.users[pk].member && S.users[pk].deals >= 1;
    const flagsOf = (o, pk) => { o.flags = o.flags || []; if (o.flags.includes(pk)) return false; o.flags.push(pk); if (o.flags.length >= R.flagsToHide) o.hidden = true; return true; };
    // カード1枚ずつ（copy）を持ち主ごとに数える。used：使った（受け取った）もの。from：作った人から持ったか、譲り受けたか
    const holdsOf = (c, pk) => c.copies.filter(x => x.owner === pk && !x.used);
    const cap = c => c.price ? R.capPaid : R.capFree;
    // 残り＝作った数から、作った人が渡した数を引いたもの（譲ったり贈ったりしても戻らない。返したときだけ戻る）
    const left = c => c.supply == null ? Infinity : c.supply - c.issued;
    const pay = (from, to, n) => { U(from).bal -= n; U(to).bal += n; };
    const join = (pk, at, by) => { const u = U(pk); u.member = true; u.bal += R.start; u.joinedAt = at; u.vouchedBy = by; };
    const ok = (e, what) => S.log.push({at: e.created_at, id: e.id, by: e.pubkey, what});

    for (const e of evs) {
      let c; try { c = JSON.parse(e.content); } catch (x) { continue; }
      if (!c || typeof c !== "object" || (c.v !== undefined && !(Number.isInteger(c.v) && c.v >= 1 && c.v <= R.version))) continue;
      const me = U(e.pubkey), t = e.created_at;
      // 最初の人たちは、何か出来事を出した時点で参加
      if (!me.member && founders.has(e.pubkey)) join(e.pubkey, t, null);

      if (c.t === "profile") { me.name = str(c.name, 40); me.line = str(c.line, 60); continue; }

      // 1 はじまり：参加している人が、まだの人を認める（1人3人まで）
      if (c.t === "vouch") {
        if (!me.member || !isHex(c.who, 64) || c.who === e.pubkey || me.vouched.length >= R.vouchMax) continue;
        if (U(c.who).member) continue;
        me.vouched.push(c.who); join(c.who, t, e.pubkey); ok(e, "vouch"); continue;
      }

      // 友達：相手のプロフィールカードを持つ（無料・1人1枚）。お互いに友達なら、2人だけで話せる
      if (c.t === "friend" || c.t === "unfriend") {
        if (!me.member || !isHex(c.who, 64) || c.who === e.pubkey || !U(c.who).member) continue;
        me.friends = me.friends.filter(x => x !== c.who); if (c.t === "friend") me.friends.push(c.who);
        ok(e, c.t); continue;
      }
      // 会話：カードの公開の会話（コメント）。参加している人だけ。輪のカードは輪の人だけ
      if (c.t === "comment") {
        const card = S.cards[c.card], text = str(c.text, R.commentMax).trim();
        if (!card || card.hidden || card.gone || !me.member || !text) continue;
        if (card.circle && !S.circles[card.circle].members.includes(e.pubkey)) continue;
        const cm = {id: e.id, card: card.id, by: e.pubkey, at: t, text, holder: holdsOf(card, e.pubkey).length > 0, flags: [], hidden: false};
        S.comments[e.id] = cm; (card.talk = card.talk || []).push(e.id); ok(e, "comment"); continue;
      }
      // 危ないものを知らせる：実績のある別々の人2人で、カードや会話が隠れる。自分のものには出せない
      if (c.t === "flag") {
        if (!trusted(e.pubkey)) continue;
        const target = c.card ? S.cards[c.card] : c.comment ? S.comments[c.comment] : null;
        if (!target || target.by === e.pubkey) continue;
        if (flagsOf(target, e.pubkey)) ok(e, "flag"); continue;
      }
      // 自分の書いた会話を消す（記録には「消した」ことが残る）
      if (c.t === "uncomment") { const cm = S.comments[c.comment]; if (!cm || cm.by !== e.pubkey || cm.removed) continue; cm.removed = true; cm.hidden = true; ok(e, "uncomment"); continue; }

      // 仲間の輪：作った人と、選ばれた人たち。輪の中のカードの中身は、輪の鍵で封をして置く（外からは読めない）
      if (c.t === "circle") {
        if (!Array.isArray(c.members) || c.members.length > 50 || !c.members.every(m => isHex(m, 64))) continue;
        S.circles[e.id] = {id: e.id, by: e.pubkey, name: str(c.name, 40), members: [...new Set([e.pubkey, ...c.members])], at: t};
        ok(e, "circle"); continue;
      }
      if (c.t === "circle-add") {
        const ci = S.circles[c.circle]; if (!ci || ci.by !== e.pubkey || !isHex(c.who, 64)) continue;
        if (!ci.members.includes(c.who)) ci.members.push(c.who); continue;
      }
      // 輪から抜ける（本人）・外す（輪を作った人）。作った人は抜けられない
      if (c.t === "circle-leave" || c.t === "circle-remove") {
        const ci = S.circles[c.circle]; if (!ci) continue;
        const who = c.t === "circle-leave" ? e.pubkey : c.who;
        if (c.t === "circle-remove" && ci.by !== e.pubkey) continue;
        if (who === ci.by || !ci.members.includes(who)) continue;
        ci.members = ci.members.filter(m => m !== who); ok(e, c.t); continue;
      }

      // カードを作る（参加していなくても作れる。持つには jeni が要る）
      if (c.t === "card") {
        if (!KINDS.includes(c.kind) || !int(c.price, 0, R.priceMax)) continue;
        const supply = c.supply == null ? null : (int(c.supply, 1, 100000) ? c.supply : undefined);
        if (supply === undefined) continue;
        const card = {id: e.id, by: e.pubkey, at: t, kind: c.kind, title: str(c.title, 80), body: str(c.body, 2000), media: str(c.media, 300),
          price: c.price, supply, copies: [], queue: [], tips: 0, tipped: 0, refunds: 0, circle: null, issued: 0, talk: [], items: [], flags: [], hidden: false};
        if (c.circle !== undefined) { const ci = S.circles[c.circle]; if (!ci || !ci.members.includes(e.pubkey)) continue; card.circle = ci.id; }
        // その場で売る：一度きりの番号（の要約）と期限。番号を知っている人（QR を読んだ人）だけが持てる。持つと同時に受け取り済み
        if (c.kind === "project") { card.want = str(c.want, 200); card.state = "doing"; }
        if ((c.kind === "event" || c.kind === "service") && supply == null) continue;
        if (BUNDLE.includes(c.kind) && (c.price !== 0 || supply != null)) continue;   // つなぐカードは無料・数なし。持つ＝常連・会員・仲間になる（知らせが届く）   // イベントは定員、サービスは枠がいる。持つ＝参加券・受ける券
        if (AT.includes(c.kind)) {
          card.when = str(c.when, 60); card.place = str(c.place, 100);
          if (c.geo !== undefined) { const g = c.geo; if (!Array.isArray(g) || g.length !== 2 || !g.every(Number.isFinite) || Math.abs(g[0]) > 90 || Math.abs(g[1]) > 180) continue; card.geo = [Math.round(g[0] * 1e5) / 1e5, Math.round(g[1] * 1e5) / 1e5]; }
        }
        card.qr = QR.includes(c.qr) ? c.qr : "open";
        if (card.qr === "orig" && (COUNTED.includes(c.kind) || BUNDLE.includes(c.kind))) card.qr = "open";   // 元のデータはデータのカードだけ
        if (c.lock !== undefined) {
          if (!isHex(c.lock, 64) || !int(c.until, t, t + R.saleMax) || supply !== 1) continue;
          card.lock = c.lock; card.until = c.until; card.handover = true;
        }
        S.cards[e.id] = card; ok(e, "card"); continue;
      }

      // プロジェクトを育てる：自分のカードを、プロジェクトのカードにつなぐ。外すのは、つないだ人かプロジェクトを作った人
      if (c.t === "attach" || c.t === "detach") {
        const pj = S.cards[c.project], it = S.cards[c.card];
        if (!pj || !it || !BUNDLE.includes(pj.kind) || pj.hidden || it.hidden || pj.gone || it.gone || !me.member || pj.id === it.id) continue;
        if (c.t === "attach" && !OPEN_BUNDLE.includes(pj.kind) && pj.by !== e.pubkey) continue;
        if (pj.circle && !S.circles[pj.circle].members.includes(e.pubkey)) continue;
        if (c.t === "attach") { if (it.by !== e.pubkey || pj.items.some(x => x.card === it.id)) continue; pj.items.push({card: it.id, by: e.pubkey, at: t}); }
        else { const i = pj.items.findIndex(x => x.card === it.id); if (i < 0 || (pj.by !== e.pubkey && pj.items[i].by !== e.pubkey)) continue; pj.items.splice(i, 1); }
        ok(e, c.t); continue;
      }

      // プロジェクトの状態（準備中・進行中・できた）は、作った人だけが変えられる
      if (c.t === "pjstate") { const pj = S.cards[c.project]; if (pj && pj.kind === "project" && pj.by === e.pubkey && ["prep", "doing", "done"].includes(c.state)) pj.state = c.state; continue; }

      const card = S.cards[c.card];
      if (!card || card.gone) continue;   // 取り下げたカードには、もう何もできない
      if (card.hidden && ["hold", "want", "tip"].includes(c.t)) continue;   // 隠されたカードは、新しく持てない・投げ銭できない
      if (card.closed && ["hold", "want"].includes(c.t)) continue;           // 受付を終えたカードは、新しく持てない・順番を待てない

      // 直す：作った人だけ。題・説明・日時・場所・地図の点・求めているもの。値段・数・種類は直せない（持った人との約束なので）
      if (c.t === "edit") {
        if (card.by !== e.pubkey) continue;
        if (c.title !== undefined) card.title = str(c.title, 80);
        if (c.body !== undefined) card.body = str(c.body, 2000);
        if (AT.includes(card.kind)) {
          if (c.when !== undefined) card.when = str(c.when, 60);
          if (c.place !== undefined) card.place = str(c.place, 100);
          if (c.geo === null) delete card.geo;
          else if (c.geo !== undefined) { const g = c.geo; if (Array.isArray(g) && g.length === 2 && g.every(Number.isFinite) && Math.abs(g[0]) <= 90 && Math.abs(g[1]) <= 180) card.geo = [Math.round(g[0] * 1e5) / 1e5, Math.round(g[1] * 1e5) / 1e5]; }
        }
        if (card.kind === "project" && c.want !== undefined) card.want = str(c.want, 200);
        card.edits = (card.edits || 0) + 1; ok(e, "edit"); continue;
      }
      // 取り下げる：作った人だけ。まだだれも持っていなければ消える。持っている人がいれば「受付を終える」（持っている人のものはそのまま）
      if (c.t === "retire") {
        if (card.by !== e.pubkey) continue;
        if (!card.copies.length) card.gone = true; else card.closed = true;
        card.queue = []; ok(e, "retire"); continue;
      }

      // 2 持つ：作った人から（数に限りがあるときは残りがあるあいだ）
      if (c.t === "hold") {
        if (!me.member || e.pubkey === card.by || left(card) <= 0) continue;
        if (holdsOf(card, e.pubkey).length >= cap(card) || me.bal < card.price) continue;
        if (card.lock && (t > card.until || typeof c.code !== "string" || sha256hex(c.code) !== card.lock)) continue;
        if (card.circle && !S.circles[card.circle].members.includes(e.pubkey)) continue;
        // 持ち方：show＝みんなに見せる、hide＝画面に出さない（記録を調べれば分かる）、lock＝何を持ったかに鍵（数に限りのないカードだけ。投げ銭の分け前は受け取らない）
        const vis = ["show", "hide", "lock"].includes(c.vis) ? c.vis : "show";
        if (vis === "lock" && card.supply != null) continue;
        pay(e.pubkey, card.by, card.price); me.deals++; U(card.by).deals++;
        card.copies.push({owner: e.pubkey, fromCreator: true, paid: card.price, at: t, used: card.handover ? t : null, vis}); card.issued++;
        card.queue = card.queue.filter(p => p !== e.pubkey);
        ok(e, "hold"); continue;
      }

      // 3 譲る：残りのないカードがほしい人は順番を待ち、持ち主が待っている人に譲る（同じ値段、jeni は手放した人へ）
      if (c.t === "want") {
        if (!me.member || card.supply == null || e.pubkey === card.by || card.queue.includes(e.pubkey)) continue;
        if (holdsOf(card, e.pubkey).length >= cap(card)) continue;
        card.queue.push(e.pubkey); continue;
      }
      if (c.t === "unwant") { card.queue = card.queue.filter(p => p !== e.pubkey); continue; }
      if (c.t === "pass") {
        const to = c.to, mine = holdsOf(card, e.pubkey);
        if (!mine.length || !card.queue.includes(to) || !U(to).member) continue;
        if (holdsOf(card, to).length >= cap(card) || U(to).bal < card.price) continue;
        pay(to, e.pubkey, card.price); me.deals++; U(to).deals++;
        Object.assign(mine[0], {owner: to, fromCreator: false, paid: card.price, at: t, vis: "show", redeem: null});
        card.queue = card.queue.filter(p => p !== to); ok(e, "pass"); continue;
      }

      // 見せ方を変える：みんなに見せる ⇔ 画面に出さない（鍵をかけて持ったものは変えられない。鍵を外すと何を持ったかが分かってしまうため）
      if (c.t === "vis") {
        if (!["show", "hide"].includes(c.vis)) continue;
        const xs = holdsOf(card, e.pubkey).filter(x => x.vis !== "lock"); if (!xs.length) continue;
        for (const x of xs) x.vis = c.vis; continue;
      }

      // 贈る：持っているカードを、参加している人へ（jeni は動かない）
      if (c.t === "gift") {
        const to = c.to, mine = holdsOf(card, e.pubkey);
        if (!mine.length || !isHex(to, 64) || to === e.pubkey || to === card.by || !U(to).member) continue;
        if (holdsOf(card, to).length >= cap(card)) continue;
        Object.assign(mine[0], {owner: to, fromCreator: false, paid: 0, at: t, vis: "show", redeem: null}); ok(e, "gift"); continue;
      }

      // 使う：現物を受け取ったことを、作った人が記録する（その1枚は「使った」になり、上限が空く）

  } catch (e) { face.dataset.ink = "l"; face.dataset.busy = ""; }
}

function create() {
  readMK();
  if (!U().member && MK.mode === "sale") return toast("参加すると売れます");
  if (MK.mode === "sale") {
    if (!MK.img) return toast("写真を選んでください");
    const code = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, "0")).join("");
    const e = emit(me, {t: "card", kind: "rwa", title: MK.title, price: MK.price || 80, supply: 1, lock: sha256hex(code), until: clock + 300});
    MEDIA[e.id] = {img: MK.img, where: "その場で手渡し", note: "その場で売って、その場で渡したもの。このカードがレシートになります。"};
    MK.sale = {id: e.id, code, until: clock + 300, start: Date.now()};
    return saleQR();
  }
  const k = MK.mode;
  if (k === "app" && !/^https:\/\/\S+$/.test(MK.url || "")) return toast("アプリのURLは https:// から");
  if ((k === "music" || k === "video") && !MK.src) return toast(k === "music" ? "音を選んでください" : "動画を選んでください");
  const c = {t: "card", kind: k, title: MK.title || "題のないカード", price: MK.price, body: MK.body || ""};
  if (k === "project" && MK.want) c.want = MK.want;
  if (k === "picture" && !MK.img) return toast("写真を選んでください");
  if (COUNTED.includes(k)) c.supply = MK.supply;
  if (AT.includes(k)) { c.when = MK.when; c.place = MK.place; if (MK.geo) c.geo = MK.geo; }
  if (BUNDLE.includes(k)) c.price = 0;
  c.qr = MK.qr || "open";
  if (MK.circle) c.circle = MK.circle;
  const e = emit(me, c);
  if (!S.cards[e.id]) return toast("出せませんでした");
  MEDIA[e.id] = {img: MK.img || "", note: "", url: k === "app" ? MK.url : "", src: MK.src || "", len: MK.len || ""};
  Object.assign(MK, {mode: "make", title: "", body: "", img: "", price: 0, supply: 1, circle: "", want: "", url: "", src: "", len: "", when: "", place: "", geo: null, qr: "open"});
  detail(e.id); toast("カードを出しました");
}

function pickMedia(src) {
  MK.src = src; MK.len = ""; make();
  const el = document.createElement(MK.mode === "music" ? "audio" : "video"); el.preload = "metadata";
  el.onloadedmetadata = () => { const d = Math.round(el.duration || 0); if (d && MK.src === src) { if ($("m-title")) readMK(); MK.len = `${Math.floor(d / 60)}:${String(d % 60).padStart(2, "0")}`; if ($("m-media")) make(); } };
  el.src = src;
}
document.addEventListener("change", e => {
  if (e.target.id === "m-media" && e.target.files[0]) { readMK(); return pickMedia(URL.createObjectURL(e.target.files[0])); }
  if (e.target.id === "who") { me = e.target.value; field = "all"; playing = ""; player.pause(); return home(); }
  if (e.target.id === "m-photo" && e.target.files[0]) {
    readMK(); const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 800 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      MK.img = cv.toDataURL("image/jpeg", .85); make(); }; im.src = fr.result; };
    fr.readAsDataURL(e.target.files[0]);
  }
});

/* 長押し：押しているあいだボタンが満ち、満ちたら決める（はなすと戻る） */
