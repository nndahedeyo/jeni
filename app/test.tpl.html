<title>jeni テスト版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark light">
<style>
/* jeni テスト版（つながない）。記録はこの画面の中だけ。何人かを切り替えて、きまりどおりに動くかを確かめる */
:root{
  --bg:#0f1411; --card:#171e19; --sunk:#1f2822; --ink:#e7ede8; --mute:#8fa094; --line:#2b372f;
  --gold:#e2c06b; --gold-ink:#1a1608; --leaf:#7fbf8a; --leaf-soft:#1f3326; --warn:#e8a07a;
  --t-rwa:#1d2a1f; --t-media:#1b1f2e; --t-text:#2a2219;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#efe9dc; --card:#f8f4ea; --sunk:#e6dfcf; --ink:#2b261c; --mute:#7a705d; --line:#d8cfbb;
  --gold:#a87a1e; --gold-ink:#fffaf0; --leaf:#3f7a4c; --leaf-soft:#dde9da; --warn:#b4552a;
  --t-rwa:#e9ecdc; --t-media:#e3e4ea; --t-text:#efe3d1; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#efe9dc; --card:#f8f4ea; --sunk:#e6dfcf; --ink:#2b261c; --mute:#7a705d; --line:#d8cfbb;
  --gold:#a87a1e; --gold-ink:#fffaf0; --leaf:#3f7a4c; --leaf-soft:#dde9da; --warn:#b4552a;
  --t-rwa:#e9ecdc; --t-media:#e3e4ea; --t-text:#efe3d1; color-scheme:light;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,.line:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.coin{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}

/* テスト版の帯：だれとして見ているか */
.tbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.tbar .tag{border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
.tbar label{display:flex;align-items:center;gap:6px;margin-left:auto}
.tbar select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;min-height:32px}
.tbar .reset{border:0;background:none;color:var(--mute);text-decoration:underline;padding:4px}

/* プロフィールカード（メニューを兼ねる） */
.me{aspect-ratio:1.586;max-width:100%;border-radius:18px;background:var(--card);border:1px solid var(--line);padding:16px;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
.me-top{display:flex;align-items:center;gap:10px;min-width:0}
.me-top>div:nth-child(2){min-width:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-weight:700;flex:none}
.me-name{font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-line{font-size:12px;color:var(--mute)}
.bal{margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.bal small{font-size:12px;color:var(--mute);font-weight:600}
.me-mid{display:flex;justify-content:flex-end;align-items:center}
.pmark{border:0;background:none;padding:4px;color:var(--gold);border-radius:10px;animation:glow2 3.6s ease-in-out infinite}
.pmark svg{display:block;overflow:visible}
.pmark .halo{stroke:transparent}
@keyframes glow2{0%,100%{filter:drop-shadow(0 0 1px rgba(226,182,78,.3))}50%{filter:drop-shadow(0 0 6px rgba(226,182,78,.9))}}
.menu{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;align-self:end}
.menu button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--mute);display:grid;place-items:center;padding:0}
.menu button[aria-pressed="true"]{background:var(--leaf-soft);color:var(--leaf)}
.menu button.make{background:var(--gold);color:var(--gold-ink)}
.cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);padding:0 4px}
.notice{background:var(--leaf-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.notice b{color:var(--leaf)}

/* 一覧：小さな行 */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{position:relative;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.line{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.th{width:52px;height:52px;border-radius:12px;border:0;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;background:var(--sunk);color:var(--mute)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th[data-k="music"],.th[data-k="video"]{background:var(--t-media);color:var(--ink)}
.th[data-k="text"]{background:var(--t-text)} .th[data-k="rwa"]{background:var(--t-rwa)}
.th .pl{position:absolute;inset:auto 4px 4px auto;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.th .pl svg.i{width:12px;height:12px;fill:currentColor;stroke:none}
.mid{min-width:0}
.t{font-weight:700;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);min-width:0;margin-top:2px}
.s svg.i{width:14px;height:14px}
.s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .left{color:var(--leaf);font-weight:700;flex:none}
.s .lk{color:var(--gold);flex:none}
.hold{display:flex;align-items:center;gap:4px;border:0;border-radius:999px;min-height:36px;padding:0 12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--leaf);color:var(--bg);white-space:nowrap}
.hold .lb{font-size:11px;font-weight:600;opacity:.85;margin-right:2px}
.hold.free{background:transparent;border:1px solid var(--leaf);color:var(--leaf)}
.bar{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.empty{color:var(--mute);text-align:center;padding:28px 12px;margin:0;font-size:13px}
@media (max-width:360px){.line{gap:10px;padding:10px}.line .hold{padding:0 10px}}

/* 詳細・作る画面（シート） */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--leaf);font-weight:700;padding:6px 0;min-height:40px}
.rh{font-size:20px;margin:6px 2px 2px}
.sub{margin:0 2px;font-size:13px;color:var(--mute)}
.acts2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acts2 .mine{margin-right:auto;font-size:12px;color:var(--mute)}
.pill{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.go{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.pill.warn{color:var(--warn)}
.flow{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:8px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:13px;line-height:1.6}
.flow dt{color:var(--mute)} .flow dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.flow small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.box h3{font-size:13px;color:var(--mute);margin:0 0 6px;font-weight:600}
.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px}
.kv dt,.kv dd{padding:8px 0;border-top:1px solid var(--line);margin:0;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv>:nth-child(-n+2){border-top:0}
.who-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.who-row:first-of-type{border-top:0}
.who-row span{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-row .pill{min-height:34px;font-size:13px;padding:0 12px}
.preview{border-radius:14px;overflow:hidden;background:var(--sunk)}
.preview img,.preview video{width:100%;display:block}
.preview.small img{filter:blur(6px) saturate(.9);transform:scale(1.05)}
.preview p{margin:0;padding:12px 14px;font-size:14px;line-height:1.8;background:var(--t-text)}
.preview audio{width:100%;display:block}
.lockmsg{font-size:12px;color:var(--mute);padding:8px 14px;display:flex;gap:6px;align-items:center}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);cursor:pointer}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--leaf)}
.opt b{font-size:14px} .opt small{grid-column:2;font-size:12px;color:var(--mute);line-height:1.5}
.opt.off{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;min-height:36px;font-size:14px;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.fl{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.fl input,.fl textarea,.fl select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.fl textarea{min-height:80px;resize:vertical}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:999px;padding:4px}
.tabs button{border:0;border-radius:999px;background:none;min-height:36px;font-weight:700;font-size:14px;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.ph-pick{position:relative;display:grid;place-items:center;aspect-ratio:1.586;border-radius:18px;border:2px dashed var(--line);background:var(--sunk) var(--img,none) center/cover;color:var(--mute);font-weight:700;cursor:pointer;overflow:hidden}
.ph-pick.has{border-style:solid}
.ph-pick.has span{background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;align-self:end;margin-bottom:12px}
.ph-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph-pick:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.big{border:0;border-radius:999px;min-height:48px;font-weight:700;background:var(--leaf);color:var(--bg);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.big.ghost{background:transparent;border:1px solid var(--leaf);color:var(--leaf)}
.qrbox{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;justify-items:center}
.qrwrap{position:relative;width:min(100%,260px)}
.qrwrap svg.q{width:100%;display:block;border-radius:8px;transition:opacity .4s}
.ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none}
.ring rect{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.who-sees{margin:4px 0 0;padding:8px 12px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:13px}
.done{display:grid;justify-items:center;gap:6px;text-align:center;padding-top:16px}
.done .coin{width:72px;height:72px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:grid;gap:8px}
.rules li{counter-increment:r;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 44px;position:relative;font-size:14px;line-height:1.7}
.rules li::before{content:counter(r);position:absolute;left:14px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-size:12px;font-weight:700;display:grid;place-items:center}
.rules b{display:block}
.rnote{margin:0;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:13px;line-height:1.8;color:var(--mute)}
.rnote b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
/* 1枚ずつ上下にめくる */
.sheet.feed{scroll-snap-type:y mandatory;padding-top:0;padding-bottom:0}
.sheet.feed>.wrap{gap:0}
.ftop{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) 0 6px;background:linear-gradient(var(--bg) 70%,transparent)}
.ftop .sub{font-size:11px}
.pg{min-height:calc(100dvh - 52px);scroll-snap-align:start;scroll-margin-top:52px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 0 28px}
.pg .acts2{min-height:48px}
.fline{margin:0 2px;font-size:12px;color:var(--mute);line-height:1.6}
.note1{margin:0 2px;font-size:14px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pg .body{margin:0;padding:12px 14px;border-radius:14px;background:var(--t-text);font-size:14px;line-height:1.9;max-height:34dvh;overflow:auto}
.minor{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--mute)}
.minor .link{border:0;background:none;padding:6px 0;color:var(--leaf);font-size:12px;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.tipbox{display:grid;gap:8px;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.lp{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font-weight:700;font-size:15px;white-space:nowrap;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lp.go{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.lp small{font-size:11px;font-weight:600;opacity:.8}
.lp i{position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:left;transition:transform .15s ease-out;pointer-events:none}
.lp.pressing i{transform:scaleX(1);transition:transform .7s linear}
.tipbox .lp{justify-self:start}
.jc2 .cplay{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:14cqw;height:14cqw;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.jc2 .cplay svg.i{width:6cqw;height:6cqw;fill:currentColor;stroke:none}
.jc2 .cplay.on{background:rgba(226,182,78,.85);color:#1a1608}
.jc2 .cview{position:absolute;inset:0 30% 30% 0;border:0;background:none;padding:0}
.jc2 .cbar{position:absolute;left:0;right:0;bottom:0;height:.9cqw;background:rgba(255,255,255,.15)}
.jc2 .cbar i{display:block;height:100%;width:0;background:#e2b64e}
.jc2 video.inplay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 下から出る記録 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
.over{position:fixed;left:0;right:0;bottom:0;z-index:26;max-height:82dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;display:grid;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px -10px rgba(0,0,0,.5)}
.over>*{max-width:440px;width:100%;justify-self:center}
.over .grab{width:40px;height:4px;border-radius:2px;background:var(--line)}
.over .x{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:8px;width:36px;height:36px;border:0;background:none;color:var(--mute);font-size:22px}
.bigimg{width:100%;border-radius:14px;display:block}
.form{display:grid;gap:10px}
/* 貝が降る */
.rain{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.rain span{position:absolute;top:-40px;width:var(--w);animation:fall var(--d) cubic-bezier(.3,.1,.6,1) forwards}
.rain span svg{width:100%;height:auto;display:block}
@keyframes fall{0%{transform:translateY(0) rotate(0)}80%{opacity:1}100%{transform:translateY(105dvh) rotate(var(--r));opacity:0}}
.guide{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;border:1px dashed var(--gold);background:var(--card);color:var(--gold);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;min-height:34px;box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.gl{display:grid;gap:8px}
.gi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gi .n{width:24px;height:24px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font-size:12px;font-weight:700}
.gi b{font-size:14px} .gi small{grid-column:2/4;font-size:12px;color:var(--mute);line-height:1.5}
.gi .pill{min-height:34px;font-size:13px}

/* カード（1.586）：中身はカードいっぱい、情報はその上。持っているときだけ黄金らせんの印が現れて光る */
.jc2{container-type:inline-size;aspect-ratio:1.586;max-width:100%;position:relative;perspective:1400px}
.jc2 .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.jc2.on .in{transform:rotateY(180deg)}
.jc2 .face{position:absolute;inset:0;border-radius:5.2cqw;overflow:hidden;color:#1f1b14;backface-visibility:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 12px 26px -14px rgba(0,0,0,.6)}
.jc2 .back{transform:rotateY(180deg)}
.jc2 .paper,.jc2 .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.jc2 .gfield{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.jc2 .gfield path{vector-effect:non-scaling-stroke}
.jc2 .shade{position:absolute;inset:0;pointer-events:none}
.jc2 .face[data-ink="l"] .shade{background:linear-gradient(180deg,rgba(0,0,0,var(--tc,.28)),rgba(0,0,0,0) 26%,rgba(0,0,0,0) 44%,rgba(0,0,0,var(--sc,.5)))}
.jc2 .face[data-ink="d"] .shade{background:linear-gradient(180deg,rgba(255,255,255,var(--tc,.4)),rgba(255,255,255,0) 26%,rgba(255,255,255,0) 44%,rgba(255,255,255,var(--sc,.55)))}
.jc2 .face[data-busy]{--sc:.85;--tc:.7}
.jc2 .face[data-ink="l"]{--ink:#fff;--halo:rgba(0,0,0,.55)} .jc2 .face[data-ink="d"]{--ink:#1f1b14;--halo:rgba(255,255,255,.75)}
.jc2 .txt,.jc2 .jno,.jc2 .excerpt{color:var(--ink);text-shadow:0 0 1px var(--halo),0 0 2px var(--halo),0 1px 10px var(--halo)}
.jc2 .txt{position:absolute;left:6cqw;right:24cqw;bottom:5.4cqw}
.jc2 .k{font-size:3cqw;letter-spacing:.08em;opacity:.85}

<script>/*QR*/</script>
<script>
"use strict";
const {reduce, sha256hex, R: RULE} = JeniRules;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const COIN = `/*COIN*/`;
const coin = (cls = "") => COIN.replace("<svg ", `<svg class="coin ${cls}" aria-hidden="true" `);
const G = /*G*/, PHI = (1 + Math.sqrt(5)) / 2;
const KIND = {rwa: "現物", music: "音楽", video: "動画", picture: "写真", text: "文章", other: "そのほか"};

/* ---- 見本の人たちと、はじめの記録（この画面の中だけ。どこにも送らない） ---- */
const P = {
  kenji: {pk: "a".repeat(64), name: "Kenji", line: "自然を愛するつくり手"},
  farmer: {pk: "b".repeat(64), name: "Farmer_S", line: "千葉で野菜をつくる"},
  haru: {pk: "c".repeat(64), name: "Bakery_Haru", line: "天然酵母のパン屋"},
  sound: {pk: "d".repeat(64), name: "SoundArchitect", line: "自然の音を集める"},
  yuzu: {pk: "e".repeat(64), name: "ゆず", line: "これから参加する人"},
};
const byPk = Object.fromEntries(Object.values(P).map(p => [p.pk, p]));
const nameOf = pk => (S.users[pk] && S.users[pk].name) || (byPk[pk] && byPk[pk].name) || pk.slice(0, 6);
const FOUNDERS = [P.kenji.pk];
const MEDIA = {};   // カードの中身（写真・音・本文）。本物では、輪のカードは鍵で封をしてから置く
let EV = [], seq = 0, clock = 0, S = null, me = P.kenji.pk;
function emit(who, c) {
  clock += 30;
  const e = {id: String(++seq).padStart(6, "0"), pubkey: who, created_at: clock, kind: 7720, content: JSON.stringify(c)};
  EV.push(e); S = reduce(EV, clock, {founders: FOUNDERS}); return e;
}
function seed() {
  EV = []; seq = 0; clock = 1000; for (const k in MEDIA) delete MEDIA[k];
  const {kenji: A, farmer: B, haru: C, sound: D} = P;
  for (const p of [A, B, C, D]) emit(p.pk, {t: "profile", name: p.name});
  emit(A.pk, {t: "vouch", who: B.pk}); emit(A.pk, {t: "vouch", who: C.pk}); emit(B.pk, {t: "vouch", who: D.pk});
  const card = (who, c, m) => { const e = emit(who.pk, {t: "card", ...c}); MEDIA[e.id] = m || {}; return e.id; };
  const radish = card(B, {kind: "rwa", title: "朝採り大根 3本セット", price: 80, supply: 10}, {img: "media/radish.jpg", note: "朝に抜いた大根を3本。千葉の畑で受け取れます。", where: "千葉県 の畑"});
  const waves = card(D, {kind: "music", title: "Ambient Waves", price: 50}, {src: "media/waves.mp3", len: "0:24", note: "自然と調和する音。作業のあいまに。"});
  const soil = card(B, {kind: "text", title: "土を耕すということ", price: 0, body: "土は、耕すほどやわらかくなるわけではありません。根が通り、虫が通り、水が通る道を、少しだけ手伝うのが耕すということだと思っています。今年は、耕す回数を半分にしてみました。すると、畑の真ん中に小さな道ができました。"}, {note: "畑で考えたことの短い文章。"});
  const bread = card(C, {kind: "rwa", title: "天然酵母カンパーニュ", price: 60, supply: 3}, {img: "media/bread.jpg", note: "自家製の天然酵母で焼いたパン。店頭で受け取り。", where: "東京都 の店頭"});
  const paddy = card(B, {kind: "picture", title: "夜明けの田んぼ", price: 0}, {img: "media/paddy.jpg", note: "冬の前の、最後の朝焼け。"});
  const field = card(B, {kind: "video", title: "畑の一日", price: 30}, {src: "media/field.mp4", img: "media/field.jpg", len: "0:08", note: "日の出から日の入りまでを短く。"});
  const curry = card(C, {kind: "rwa", title: "特製スパイスカレー", price: 120, supply: 1}, {img: "media/curry.jpg", note: "1日1皿だけのカレー。", where: "東京都 の店頭"});
  const rain = card(D, {kind: "music", title: "雨の作業小屋", price: 40}, {src: "media/rain.mp3", len: "0:18", note: "雨の日の小屋で鳴っていた音を元に。"});
  emit(A.pk, {t: "hold", card: curry, vis: "show"});
  emit(A.pk, {t: "hold", card: bread, vis: "show"});
  emit(C.pk, {t: "hold", card: waves, vis: "show"}); emit(B.pk, {t: "hold", card: waves, vis: "hide"});
  emit(D.pk, {t: "hold", card: paddy, vis: "show"}); emit(C.pk, {t: "hold", card: field, vis: "show"});
  emit(B.pk, {t: "want", card: curry});
  emit(C.pk, {t: "tip", card: waves, amount: 20});
  const ci = emit(B.pk, {t: "circle", name: "畑の仲間", members: [A.pk, C.pk]}).id;
  card(B, {kind: "text", title: "来週の種まきの段取り", price: 0, circle: ci, body: "土曜の朝7時に畑の入口で。大根と小かぶの種をまきます。手袋だけ持ってきてください。雨なら日曜に。"}, {note: "畑の仲間だけに見えるお知らせ。"});
  void radish; void soil; void bread; void rain;
}

/* ---- 黄金らせんの印・地の模様・QR ---- */
const gmark = (w, {frame = false, sw = 2.4, line = false, halo = false} = {}) => {
  const k = PHI / w, pad = sw * 2.2 * k;
  return `<svg viewBox="${-pad} ${-pad} ${PHI + pad * 2} ${1 + pad * 2}" width="${w}" aria-hidden="true">
    ${halo ? `<path class="halo ${line ? "ln" : ""}" pathLength="1" d="${G}" fill="none" stroke-width="${sw * 2.6 * k}" stroke-linecap="round"/>` : ""}
    <path class="${line ? "ln" : ""}" pathLength="1" d="${G}" fill="none" stroke="currentColor" stroke-width="${sw * k}" stroke-linecap="round"/>
    ${frame ? `<rect x="0" y="0" width="${PHI}" height="1" rx=".1" fill="none" stroke="currentColor" stroke-width="${sw * 1.5 * k}"/>` : ""}</svg>`;
};
const gfield = (k = 1) => `<svg class="gfield" viewBox="0 0 ${PHI} 1" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke-linecap="round">
  <path d="${G}" stroke="#000" stroke-opacity="${.16 * k}" stroke-width="2.6"/><path d="${G}" stroke="#fff" stroke-opacity="${.32 * k}" stroke-width="1"/></g></svg>`;
function qrSvg(text, cls = "") {
  const M = makeQR(text), n = M.length, q = 2, W = n + q * 2;
  let r = ""; M.forEach((row, y) => row.forEach((d, x) => { if (d) r += `M${x + q},${y + q}h1v1h-1z`; }));
  const lw = W * .24, lh = lw / 1.45, iw = lw * .74, k = PHI / iw;
  return `<svg class="${cls}" viewBox="0 0 ${W} ${W}" role="img" aria-label="QR" shape-rendering="crispEdges"><rect width="${W}" height="${W}" fill="#fff"/><path d="${r}" fill="#1a1608"/>
    <rect x="${(W - lw) / 2}" y="${(W - lh) / 2}" width="${lw}" height="${lh}" rx="${lh * .18}" fill="#fff"/>
    <g transform="translate(${(W - iw) / 2} ${(W - iw / PHI) / 2}) scale(${iw / PHI})" shape-rendering="geometricPrecision"><path d="${G}" fill="none" stroke="#1a1608" stroke-width="${.06 * k * 1.6}" stroke-linecap="round"/>
    <rect x="0" y="0" width="${PHI}" height="1" rx=".1" fill="none" stroke="#1a1608" stroke-width="${.09 * k * 1.6}"/></g></svg>`;
}

/* ---- 見ている人から見た状態 ---- */
const U = () => S.users[me] || {bal: 0, member: false, vouched: []};
const mine = c => c.copies.filter(x => x.owner === me && !x.used);
const canSee = c => !c.circle || S.circles[c.circle].members.includes(me);
const capOf = c => c.price ? RULE.capPaid : RULE.capFree;
const leftOf = c => c.supply == null ? Infinity : c.left;
const cardNo = id => String(id).replace(/^0+/, "").padStart(4, "0");
const kindIcon = k => k === "other" ? "other" : k;
let field = "all", opened = -1, playing = "", sel = null, keepScroll = false;

function sub(c) {
  const by = `<span>${esc(nameOf(c.by))}</span>`, m = MEDIA[c.id] || {};
  const lk = c.circle ? `<span class="lk">${icon("lock")}</span>` : "";
  if (mine(c).length) return `${lk}${icon(kindIcon(c.kind))}<span class="left">持っている ${mine(c).length}</span>${by}`;
  if (c.supply != null) return `${lk}${icon("rwa")}<span class="left">${c.left ? `残り${c.left}` : "残り0"}</span>${by}`;
  if (m.len) return `${lk}${icon(c.kind)}<span>${m.len}</span>${by}`;
  if (c.kind === "text") return `${lk}${icon("text")}<span>${esc(c.body)}</span>`;
  return `${lk}${icon(kindIcon(c.kind))}${by}`;
}
function thumb(c) {
  const m = MEDIA[c.id] || {};
  if (c.kind === "music" && m.src) return `<button type="button" class="th" data-k="music" data-play="${c.id}" aria-label="${playing === c.id ? "止める" : "聞く"}">${icon(playing === c.id ? "pause" : "music")}<span class="pl">${icon(playing === c.id ? "pause" : "play")}</span></button>`;
  if (m.img) return `<button type="button" class="th" data-k="${c.kind}" data-detail="${c.id}" aria-label="開く"><img src="${m.img}" alt="">${c.kind === "video" ? `<span class="pl">${icon("play")}</span>` : ""}</button>`;
  return `<div class="th" data-k="${c.kind}">${icon(kindIcon(c.kind))}</div>`;
}
function holdBtn(c) {
  if (c.by === me) return `<button type="button" class="hold free" data-detail="${c.id}">自分の</button>`;
  if (mine(c).length >= capOf(c)) return `<button type="button" class="hold free" disabled>持っている</button>`;
  if (c.supply != null && !c.left) return `<button type="button" class="hold free" data-detail="${c.id}">${c.queue.includes(me) ? "待っている" : "順番待ち"}</button>`;
  return c.price ? `<button type="button" class="hold" data-detail="${c.id}" aria-label="${c.price} jeni・開く"><span class="lb">持つ</span>${c.price}</button>`
    : `<button type="button" class="hold free" data-detail="${c.id}"><span class="lb">持つ</span>無料</button>`;
}
const FIELDS = [["all", "すべて"], ["rwa", "現物"], ["music", "音楽"], ["video", "動画"], ["picture", "写真"], ["text", "文章"], ["circle", "仲間の輪"]];
function visibleCards() {
  return Object.values(S.cards).filter(canSee).filter(c => !c.lock || c.by === me || mine(c).length || c.copies.some(x => x.owner === me))
    .filter(c => field === "all" ? true : field === "circle" ? !!c.circle : c.kind === field).sort((a, b) => b.at - a.at);
}
function home() {
  const u = U(), p = byPk[me], list = visibleCards();
  $("home").innerHTML = `
    <div class="tbar"><span class="tag">テスト版（つながない）</span>
      <label>見ている人 <select id="who">${Object.values(P).map(x => `<option value="${x.pk}" ${x.pk === me ? "selected" : ""}>${esc(x.name)}${S.users[x.pk] && S.users[x.pk].member ? "" : "（まだ参加していない）"}</option>`).join("")}</select></label>
      <button type="button" class="reset" data-reset>最初に戻す</button></div>
    <section class="me" aria-label="プロフィール">
      <div class="me-top"><div class="av" ${PICS[me] ? `style="background:url('${PICS[me]}') center/cover"` : ""}>${PICS[me] ? "" : esc(nameOf(me).slice(0, 1))}</div>
        <div><div class="me-name">${esc(nameOf(me))}</div><div class="me-line">${u.member ? esc((S.users[me] && S.users[me].line) || p.line) : "まだ参加していません"}</div></div>
        <button type="button" class="bal" data-rules title="jeni のきまり">${coin()}<span id="balv">${u.bal.toLocaleString("ja-JP")}</span><small>jeni</small></button></div>
      <div class="me-mid"><button type="button" class="pmark" data-me aria-label="わたしのカード（QR）">${gmark(56, {halo: true})}</button></div>
      <nav class="menu" aria-label="表示するカード">${FIELDS.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${field === k}" aria-label="${l}" title="${l}">${icon(k)}</button>`).join("")}
        <button type="button" class="make" data-make aria-label="カードを作る・その場で売る" title="カードを作る・その場で売る">${icon("plus")}</button></nav>
    </section>
    ${u.member ? "" : `<div class="notice">${gmark(28)}<span>まだ参加していません。<b>わたしのカード</b>のQRを、参加している人に読んでもらうと始められます。</span></div>`}
    <div class="cap"><span>${FIELDS.find(f => f[0] === field)[1]}・${list.length}枚</span><span>${field === "circle" ? "輪の中は、輪の人にしか見えません" : "記録はこの画面の中だけ"}</span></div>
    <main class="list">${list.length ? list.map(c => `<article class="row">
      <div class="line" data-detail="${c.id}" tabindex="0">${thumb(c)}<div class="mid"><div class="t">${esc(c.title || "その場のカード")}</div><div class="s">${sub(c)}</div></div>${holdBtn(c)}</div>
      ${MEDIA[c.id] && MEDIA[c.id].src && c.kind === "music" ? `<div class="bar"><i id="bar${c.id}"></i></div>` : ""}</article>`).join("")
      : `<p class="empty">${field === "circle" ? "入っている仲間の輪のカードはありません" : "まだカードがありません"}</p>`}</main>`;
}

/* ---- カードの見た目 ---- */
const PAPER = {music: ["#22283d", "#0f1220", "l"], text: ["#fffdf7", "#efe3d1", "d"], picture: ["#f4f1ea", "#ddd5c4", "d"], rwa: ["#f3f6ea", "#d9e3cc", "d"], video: ["#1b1f2e", "#0d0f18", "l"], other: ["#f4f1ea", "#ddd5c4", "d"]};
function cardHtml(c, held) {
  const m = MEDIA[c.id] || {}, bg = m.img && c.kind !== "music" ? `<img class="bgimg" src="${m.img}" alt="" data-probe>` : "";
  const pp = PAPER[c.kind] || PAPER.text, ink = bg ? "l" : pp[2];
  const front = `<div class="face" data-ink="${ink}">${bg || `<div class="paper" style="background:radial-gradient(120% 90% at 85% 10%,${pp[0]},${pp[1]})"></div>`}${gfield(bg ? 1 : .7)}<div class="shade"></div>
      <div class="jno">jeni No.${cardNo(c.id)}</div>${c.circle ? `<div class="circ">${esc(S.circles[c.circle].name)}</div>` : ""}
      ${c.kind === "text" && !bg ? `<p class="excerpt">${esc(c.body)}</p>` : ""}
      <div class="txt"><div class="k">${KIND[c.kind]}</div><div class="t">${esc(c.title || "その場のカード")}</div><div class="by">${esc(nameOf(c.by))}</div></div>
      ${(c.kind === "music" || c.kind === "video") && m.src ? `<button type="button" class="cplay${playing === c.id ? " on" : ""}" data-cplay="${c.id}" aria-label="再生・止める">${icon("play")}</button>` : m.img ? `<button type="button" class="cview" data-cplay="${c.id}" aria-label="写真を大きく"></button>` : ""}
      ${c.kind === "music" && m.src ? `<div class="cbar"><i id="cbar-${c.id}"></i></div>` : ""}
      <button type="button" class="mark" data-flip aria-label="このカードの裏（QR）">${gmark(100, {line: true, halo: true})}</button></div>`;
  const back = `<div class="face back" data-ink="d"><div class="paper" style="background:radial-gradient(120% 90% at 85% 10%,#fffdf7,#efe7d6)"></div>${gfield(.6)}
      <div class="qr">${qrSvg(`jeni:card:${c.id}`)}</div>
      <div class="bk"><div class="no">jeni No.${cardNo(c.id)}</div><div class="bt">${esc(c.title || "その場のカード")}</div><div class="how">読むと、このカードが開きます</div>

function probe(img) {
  const face = img.closest(".face"); if (!face) return;
  try {
    const W = 64, H = Math.round(64 / 1.586), cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const g = cv.getContext("2d", {willReadFrequently: true});
    const s = Math.max(W / img.naturalWidth, H / img.naturalHeight), dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    g.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
    const px = g.getImageData(0, Math.round(H * .55), W, H - Math.round(H * .55)).data;
    let n = 0, sum = 0, sq = 0;
    for (let i = 0; i < px.length; i += 4) { const L = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255; sum += L; sq += L * L; n++; }

  } catch (e) { face.dataset.ink = "l"; face.dataset.busy = ""; }
}

let saleTimer;
function saleQR() {
  const s = MK.sale, c = S.cards[s.id], L = 4 * 1000;   // 見本の画面では、残り時間を輪の長さで見せる（数字は出さない）
  openSheet(`<button type="button" class="back" data-close>${icon("back")}やめる</button>
    <h2 class="rh">買う人に読んでもらう</h2>
    <div class="qrbox"><div class="qrwrap">${qrSvg(`jeni:pay:${s.id}:${s.code}`, "q")}
      <svg class="ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="1.5" y="1.5" width="97" height="97" rx="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" id="ring"/></svg></div>
      <div style="text-align:center"><b>${esc(c.title || "その場のカード")}</b><div style="color:var(--gold);font-weight:700">${coin()} ${c.price} jeni</div></div></div>
    <p class="sub" style="font-size:12px">この QR は一度きりで、まわりの金の線がなくなると使えなくなります。写真に撮られても、あとから使い回せません。</p>
    <section class="box"><h3>見本：買う人として読む</h3>${Object.values(S.users).filter(x => x.member && x.pk !== me).map(x => `<div class="who-row"><span>${esc(nameOf(x.pk))}（${x.bal.toLocaleString("ja-JP")} jeni）</span><button type="button" class="pill go" data-buyas="${x.pk}">読む</button></div>`).join("")}</section>`);
  clearInterval(saleTimer);
  const total = 5 * 60 * 1000;
  saleTimer = setInterval(() => {
    const r = $("ring"); if (!r) return clearInterval(saleTimer);
    const k = Math.min(1, (Date.now() - s.start) / total); r.style.strokeDashoffset = k;
    if (k >= 1) { clearInterval(saleTimer); document.querySelector(".qrwrap svg.q").style.opacity = .15; document.querySelectorAll("[data-buyas]").forEach(b => b.disabled = true); }
  }, 1000);
  void L;
}
function buyAs(pk) {
  const s = MK.sale, c = S.cards[s.id];
  clearInterval(saleTimer);
  openSheet(`<p class="who-sees">ここからは <b>${esc(nameOf(pk))}</b> さんのスマホの画面です（見本）</p>
    ${cardHtml(c, false)}
    <dl class="flow"><dt>持つと</dt><dd>${c.price} jeni → ${esc(nameOf(c.by))} さんへ<small>その場で受け取るので、払うと受け取り済みになります</small></dd></dl>
    <button type="button" class="big" data-pay="${pk}">${coin()}${c.price} jeni で持つ</button>
    <button type="button" class="back" data-close>${icon("back")}やめる</button>`);
}
function pay(pk) {
  const s = MK.sale, c = S.cards[s.id], seller = me;
  me = pk; emit(pk, {t: "hold", card: s.id, code: s.code, vis: "show"}); me = seller;
  const ok = S.cards[s.id].copies.some(x => x.owner === pk);
  if (!ok) return toast("払えませんでした（jeni が足りないか、期限切れです）");
  MK.sale = null; Object.assign(MK, {title: "", img: ""});
  openSheet(`<div class="done">${coin()}<h2 class="rh">払い終わりました</h2>
    <p class="sub">${c.price} jeni が ${esc(nameOf(seller))} さんに届きました。<br>受け取り済みのカードが、レシートとして両方の手元に残ります。</p></div>
    <button type="button" class="big" data-detail="${s.id}">レシート（カード）を見る</button>
    <button type="button" class="back" data-close style="margin:0 auto">${icon("back")}一覧へ</button>`);
  shellRain();
}
function newCircle() {
  readMK();
  const others = Object.values(S.users).filter(x => x.member && x.pk !== me);
  openSheet(`<button type="button" class="back" data-make>${icon("back")}作る画面へ</button>
    <h2 class="rh">仲間の輪をつくる</h2>
    <p class="sub">輪の中に出したカードは、輪の人にしか見えません。本物では、中身を輪の鍵で封をしてから置くので、外からは読めない文字の固まりにしか見えません。</p>
    <label class="fl">輪の名前<input id="c-name" maxlength="40" placeholder="例：週末の畑"></label>
    <section class="box"><h3>入ってもらう人</h3>${others.map(x => `<label class="opt"><input type="checkbox" value="${x.pk}" data-cm><b>${esc(nameOf(x.pk))}</b></label>`).join("")}</section>
    <button type="button" class="big" data-mkcircle>輪をつくる</button>`);
}
function rules() {
  openSheet(`<button type="button" class="back" data-close>${icon("back")}一覧へ</button>
    <h2 class="rh">${coin()} jeni のきまり</h2>
    <ol class="rules">
      <li><b>はじまり</b>認められて参加すると、${RULE.start.toLocaleString("ja-JP")} jeni が届きます。1人が認められるのは${RULE.vouchMax}人まで。</li>
      <li><b>持つ</b>作った人から持つと、値段の分の jeni が作った人へ。値段はずっと変わりません。</li>
      <li><b>譲る</b>数に限りのあるカードは、持っている人から同じ値段で譲り受けます。jeni は手放した人へ戻ります。</li>
      <li><b>投げ銭</b>半分は作った人へ、半分は持っている人へ。数に限りのあるカードは、全額が作った人へ。</li>
      <li><b>上限</b>同じカードは${RULE.capPaid}枚まで（無料のカードは${RULE.capFree}枚まで）。使うか贈ると、また持てます。</li>
    </ol>
    <p class="rnote"><b>見えるもの・隠れるもの</b>　だれがだれに何 jeni 払ったかは、確かめ合うために記録に残ります（名前ではなく番号で）。「画面に出さない」はアプリに出さないだけで、記録を調べれば分かります。「鍵をかける」と、どのカードかは本人と作った人にしか分かりません。仲間の輪の中身は、輪の人にしか読めません。</p>
    <p class="rnote"><b>配る量について</b>　配る量や配り方は、使われ方を見て変わることがあります。変わるときも全員に同じきまりが同じように当てはまり、前もって知らせます。jeni は円と交換できず、値段は作った人が決めるので、配る量の大きさそのものに意味はありません。</p>
    <p class="rnote"><b>運営のサーバーはありません</b>　記録は、参加している人みんなで持ち合います。どこか1か所が止まっても、jeni は止まりません。</p>`);
}

/* ---- 再生（一覧の中でそのまま） ---- */
const player = $("player");
function play(id, inCard = false) {
  const m = MEDIA[id];
  if (playing === id) { player.pause(); playing = ""; } else { playing = id; player.src = m.src; player.play().catch(() => toast("再生できませんでした")); }
  if (!inCard) home();
  document.querySelectorAll("[data-cplay]").forEach(b => b.classList.toggle("on", b.dataset.cplay === playing));
}
player.addEventListener("timeupdate", () => {
  const k = player.duration ? (player.currentTime / player.duration * 100) + "%" : "0%";
  const b = $("bar" + playing); if (b) b.style.width = k;
  const cb = $("cbar-" + playing); if (cb) cb.style.width = k;
});
player.addEventListener("ended", () => { const id = playing; playing = ""; if ($("sheet").hidden) home(); document.querySelectorAll("[data-cplay]").forEach(b => b.classList.remove("on")); void id; });

/* ---- 変わったところ（前の版から）：押すと、その画面へ ---- */
const AS = name => P[name].pk;
const cardBy = t => Object.values(S.cards).find(c => c.title === t);
const GUIDE = [
  ["カードは1枚ずつ、上下にめくる", "一覧の行を押すとカードが開き、上下にめくると次のカード。横にスワイプすると戻ります。", () => { me = AS("kenji"); detail(cardBy("Ambient Waves").id); }],
  ["カードの中で再生", "音楽・動画はカードの再生ボタンで、そのまま。写真は押すと大きく。文章はカードの下に全部。", () => { me = AS("kenji"); detail(cardBy("畑の一日").id); }],
  ["長押しで持つ・投げ銭", "押しているあいだボタンが満ちていき、満ちたら決まります。押しまちがいで jeni が動かないように。", () => { me = AS("kenji"); detail(cardBy("雨の作業小屋").id); }],
  ["中身はだれでも全部", "持つ前でも全部見られます（旧 jeni と同じ）。持つと、元のデータ（圧縮していないもの）を受け取れます。", () => { me = AS("sound"); detail(cardBy("土を耕すということ").id); }],
  ["持っている印が光る", "持っているカードにだけ黄金らせんの印。印を押すと裏返ってQR。", () => { me = AS("kenji"); detail(cardBy("特製スパイスカレー").id); }],
  ["記録は下から", "持っている人・譲る・贈る・受け取り・返すは「記録」にまとめました。", () => { me = AS("haru"); detail(cardBy("天然酵母カンパーニュ").id); recSheet(cardBy("天然酵母カンパーニュ").id); }],
  ["見せ方はプロフィールで", "持つたびに選ぶのをやめ、プロフィールで決めておく形に。持ったあとも「見せ方」で変えられます。", () => { me = AS("kenji"); meCard(true); }],
  ["その場で売る", "写真と値段で、一度きりのQR。残り時間は数字ではなく金の線で。", () => { me = AS("kenji"); MK.mode = "sale"; make(); }],
  ["参加すると貝が降る", "まだ参加していない人のQRを読んで認めると、1,000 jeni が届きます。", () => { me = AS("yuzu"); meCard(); }],
  ["仲間の輪", "輪の中のカードは輪の人にしか見えません。SoundArchitect に切り替えると見えません。", () => { me = AS("kenji"); field = "circle"; closeSheet(); }],
  ["jeni のきまり", "残高を押すと開きます。", () => { me = AS("kenji"); rules(); }],
];
function guide() {
  openSheet(`<button type="button" class="back" data-close>${icon("back")}一覧へ</button>
    <h2 class="rh">変わったところ</h2><p class="sub">押すと、その画面が開きます。見ている人も自動で切り替わります。</p>
    <div class="gl">${GUIDE.map(([t, d], i) => `<div class="gi"><span class="n">${i + 1}</span><b>${t}</b><button type="button" class="pill" data-go="${i}">見る</button><small>${d}</small></div>`).join("")}</div>
    <button type="button" class="big ghost" data-reset style="margin-top:4px">最初の状態に戻す</button>`);
}

/* ---- 操作 ---- */
document.addEventListener("change", e => {
  if (e.target.id === "who") { me = e.target.value; field = "all"; playing = ""; player.pause(); return home(); }
  if (e.target.id === "m-photo" && e.target.files[0]) {
    readMK(); const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 800 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      MK.img = cv.toDataURL("image/jpeg", .85); make(); }; im.src = fr.result; };
    fr.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener("click", e => {
  const q = s => e.target.closest(s);
  let b;
  if (q("[data-reset]")) { seed(); me = P.kenji.pk; field = "all"; if (!$("sheet").hidden) closeSheet(); home(); return toast("最初の状態に戻しました"); }
  if (q("[data-guide]")) return guide();
  if ((b = q("[data-go]"))) { const g = GUIDE[+b.dataset.go]; closeSheet(); g[2](); home(); return; }
  if ((b = q("[data-f]"))) { field = b.dataset.f; return home(); }
  if (q("[data-make]")) { if (!U().member) return toast("参加すると作れます"); return make(); }
  if ((b = q("[data-mode]"))) { readMK(); MK.mode = b.dataset.mode; return make(); }
  if ((b = q("[data-sample]"))) { readMK(); MK.img = b.dataset.sample; return make(); }
  if (q("[data-create]")) return create();
  if (q("[data-newcircle]")) return newCircle();
  if (q("[data-mkcircle]")) {
    const ms = [...document.querySelectorAll("[data-cm]:checked")].map(x => x.value), name = ($("c-name").value || "").trim() || "仲間の輪";
    if (!ms.length) return toast("入ってもらう人を選んでください");
    const ev = emit(me, {t: "circle", name, members: ms}); MK.circle = ev.id; toast(`「${name}」をつくりました`); return make();
  }
  if ((b = q("[data-buyas]"))) return buyAs(b.dataset.buyas);
  if ((b = q("[data-pay]"))) return pay(b.dataset.pay);
  if (q("[data-rules]")) return rules();
  if (q("[data-me]")) return meCard();
  if ((b = q("[data-vouchby]"))) { const before = U().member; emit(b.dataset.vouchby, {t: "vouch", who: me}); if (!before && U().member) return joined(); return toast("認められませんでした"); }
  if (q("[data-overclose]") || e.target.id === "scrim") return closeOver();
  if (q("[data-flip]")) { const d = q(".jc2") || $("dcard"); if (d) d.classList.toggle("on"); return; }
  if ((b = q(".jc2.on")) && !q(".mark")) { b.classList.remove("on"); return; }
  if ((b = q("[data-cplay]"))) return cplay(b.dataset.cplay);
  if ((b = q("[data-rec]"))) return recSheet(b.dataset.rec);
  if ((b = q("[data-vis]"))) { const c = S.cards[b.dataset.vis], v = mine(c)[0].vis === "hide" ? "show" : "hide"; emit(me, {t: "vis", card: c.id, vis: v}); refreshPage(c.id); return toast(`見せ方：${VIS[v]}`); }
  if (q("[data-editme]")) return meCard(true);
  if (q("[data-saveme]")) {
    const name = ($("p-name").value || "").trim().slice(0, 40) || nameOf(me), line = ($("p-line").value || "").trim().slice(0, 60);
    PREF[me] = $("p-vis").value; emit(me, {t: "profile", name, line}); toast("保存しました"); return meCard();
  }
  if ((b = q("[data-play]"))) return play(b.dataset.play);
  if ((b = q("[data-tipask]"))) return tipAsk(b.dataset.tipask);
  if ((b = q("[data-amt]"))) { const id = b.dataset.for; document.querySelectorAll(`[data-amt][data-for="${id}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); $("tipbtn-" + id).textContent = `${b.dataset.amt} jeni`; return; }
  if ((b = q("[data-unwant]"))) { emit(me, {t: "unwant", card: b.dataset.unwant}); detail(b.dataset.unwant, true); return toast("順番待ちをやめました"); }
  if ((b = q("[data-passask]"))) { const c = S.cards[b.dataset.passask]; return pickPerson("譲る", c.id, "passto", c.queue, `順番を待っている人に、同じ値段（${c.price} jeni）で譲ります。jeni はあなたへ戻ります。`); }
  if ((b = q("[data-passto]"))) { const id = sel; emit(me, {t: "pass", card: id, to: b.dataset.passto}); closeOver(); detail(id); return toast(`${nameOf(b.dataset.passto)} さんに譲りました`); }
  if ((b = q("[data-giftask]"))) { const c = S.cards[b.dataset.giftask]; return pickPerson("贈る", c.id, "giftto", Object.values(S.users).filter(x => x.member && x.pk !== me && x.pk !== c.by && (!c.circle || S.circles[c.circle].members.includes(x.pk))).map(x => x.pk), "jeni は動きません。カードがその人のものになります。"); }
  if ((b = q("[data-giftto]"))) { const id = sel; emit(me, {t: "gift", card: id, to: b.dataset.giftto}); closeOver(); detail(id); return toast(`${nameOf(b.dataset.giftto)} さんに贈りました`); }
  if ((b = q("[data-used]"))) { const id = sel; emit(me, {t: "used", card: id, holder: b.dataset.used}); refreshPage(id); recSheet(id); return toast("受け取りを記録しました"); }
  if ((b = q("[data-refund]"))) { const id = sel, c = S.cards[id], x = c.copies.find(y => y.owner === b.dataset.refund && y.fromCreator); emit(me, {t: "refund", card: id, holder: b.dataset.refund}); if ($("pg-" + id)) refreshPage(id); recSheet(id); return toast(`${x ? x.paid : 0} jeni を返しました`); }
  if (q("[data-close]")) { closeOver(); return closeSheet(); }
  if ((b = q("[data-detail]"))) { player.pause(); playing = ""; return detail(b.dataset.detail); }
});
/* 長押し：押しているあいだボタンが満ち、満ちたら決める（はなすと戻る） */
let lpT = null;
function lpStart(b) {
  lpCancel(); b.classList.add("pressing");
  lpT = setTimeout(() => { b.classList.remove("pressing"); lpT = null; lpDo(b.dataset.lp, b.dataset.id); }, 700);
}
function lpCancel() { if (lpT) clearTimeout(lpT); lpT = null; document.querySelectorAll(".lp.pressing").forEach(x => x.classList.remove("pressing")); }
function lpDo(act, id) {
  if (act === "hold") return doHold(id);
  if (act === "want") { emit(me, {t: "want", card: id}); refreshPage(id); return toast("順番待ちに並びました"); }
  if (act === "tip") {
    const n = +(document.querySelector(`[data-amt][data-for="${id}"][aria-pressed="true"]`) || {dataset: {amt: 10}}).dataset.amt;
    if (n > U().bal) return toast("jeni が足りません");
    emit(me, {t: "tip", card: id, amount: n}); refreshPage(id); return toast(`${n} jeni を贈りました`);
  }
}
document.addEventListener("pointerdown", e => { const b = e.target.closest("[data-lp]"); if (b && !b.disabled) { e.preventDefault(); lpStart(b); } });
["pointerup", "pointerleave", "pointercancel"].forEach(t => document.addEventListener(t, e => { if (e.target.closest && e.target.closest("[data-lp]")) lpCancel(); }, true));
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-lp]")) e.preventDefault(); });
document.addEventListener("keydown", e => { const b = e.target.closest && e.target.closest("[data-lp]"); if (b && (e.key === "Enter" || e.key === " ") && !e.repeat) { e.preventDefault(); lpStart(b); } });
document.addEventListener("keyup", e => { if (e.target.closest && e.target.closest("[data-lp]")) lpCancel(); });
/* 横にスワイプで戻る（どちら向きでも）。上下のめくりとは分ける */
let sw = null;
document.addEventListener("touchstart", e => { if (e.touches.length === 1) sw = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()}; }, {passive: true});
document.addEventListener("touchend", e => {
  if (!sw || lpT) return; const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, dt = Date.now() - sw.t; sw = null;
  if (Math.abs(dx) < 80 || Math.abs(dy) > 50 || dt > 700) return;
  if (!$("over").hidden) return closeOver();
  if (!$("sheet").hidden) { const bk = $("sheet").querySelector(".back"); if (bk) bk.click(); }
}, {passive: true});
document.addEventListener("change", e => {
  if (e.target.id !== "p-pic" || !e.target.files[0]) return;
  const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => {
    const k = 240 / Math.min(im.width, im.height), cv = document.createElement("canvas"); cv.width = cv.height = 240;
    cv.getContext("2d").drawImage(im, (240 - im.width * k) / 2, (240 - im.height * k) / 2, im.width * k, im.height * k);
    PICS[me] = cv.toDataURL("image/jpeg", .85); toast("写真を変えました（保存を押してください）"); }; im.src = fr.result; };
  fr.readAsDataURL(e.target.files[0]);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("over").hidden) return closeOver();
  if (e.key === "Escape" && !$("sheet").hidden) closeSheet();
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("line")) detail(e.target.dataset.detail);
});
seed(); home();
window.__jt = {get S() { return S; }, get me() { return me; }, set me(v) { me = v; home(); }, P, emit, detail, home, closeSheet, MK};
</script>
