name: stamp

# 毎日1回、jeni（試験運用）の出来事をビットコインに刻む（OpenTimestamps、無料）
on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2（番号で固定：あとから中身を差し替えられないように）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install opentimestamps-client==0.7.2 websockets==13.1
      - name: 集めて刻む
        run: python scripts/stamp.py
      - name: 記録を残す
        run: |
          git add stamps
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "記録を刻む $(date -u +%F)"
            git pull --rebase -q && git push -q
          fi
